name: upload-raw
description: PUT CI bytes to an Artifact Keeper generic repo (/api/v1/repositories/{repo}/artifacts/{key}). Does not use GitHub CreateArtifact.
inputs:
  name:
    required: true
  path:
    required: true
  if-no-files-found:
    default: warn
  retention-days:
    description: >-
      1 or 7. Encoded as the key's version segment (retain-1d|retain-7d); a
      Keeper max_age_days=1 policy excluding version retain-7d enforces 1d,
      the global max_age_days=7 policy enforces 7d. Other values are rejected.
    default: "7"
  matrix-key:
    default: ""
  keeper-url:
    required: true
  keeper-token:
    required: true
outputs:
  url:
    description: Token-free download URL (GET /api/v1/repositories/{repo}/download/{key})
    value: ${{ steps.put.outputs.url }}
  key:
    description: Artifact path inside the AK repo
    value: ${{ steps.put.outputs.key }}
runs:
  using: composite
  steps:
    - id: put
      shell: bash
      env:
        ARTIFACT_KEEPER_URL: ${{ inputs.keeper-url }}
        ARTIFACT_KEEPER_TOKEN: ${{ inputs.keeper-token }}
        NAME: ${{ inputs.name }}
        PATHS: ${{ inputs.path }}
        IF_NONE: ${{ inputs.if-no-files-found }}
        RETENTION_DAYS: ${{ inputs.retention-days }}
        MATRIX_KEY: ${{ inputs.matrix-key }}
        JOB: ${{ github.job }}
        REPO: ${{ github.repository }}
        RUN_ID: ${{ github.run_id }}
        RUN_ATTEMPT: ${{ github.run_attempt }}
      run: |
        set +x
        set -euo pipefail
        if [[ -z "${ARTIFACT_KEEPER_URL:-}" || -z "${ARTIFACT_KEEPER_TOKEN:-}" ]]; then
          echo "::error::ARTIFACT_KEEPER_URL and ARTIFACT_KEEPER_TOKEN are required"
          exit 1
        fi
        case "$IF_NONE" in error|warn|ignore) ;; *) echo "::error::if-no-files-found must be error|warn|ignore"; exit 1 ;; esac
        # Only 1 and 7 have a Keeper lifecycle policy behind them; refuse a no-op.
        case "$RETENTION_DAYS" in 1|7) ;; *) echo "::error::retention-days must be 1 or 7"; exit 1 ;; esac

        shopt -s nullglob
        matches=()
        add_match() {
          # Match upload-artifact's default: empty and hidden-only paths have no files.
          local part
          local -a parts
          IFS=/ read -ra parts <<< "$1"
          for part in "${parts[@]}"; do
            [[ "$part" == .* && "$part" != . && "$part" != .. ]] && return
          done
          if [[ -d "$1" && -z "$(find -L "$1" -name '.*' -prune -o -type f -print -quit)" ]]; then return; fi
          matches+=("$1")
        }
        while IFS= read -r pat || [[ -n "$pat" ]]; do
          [[ -z "${pat// }" ]] && continue
          if [[ -e "$pat" ]]; then
            add_match "$pat"
          else
            # glob expansion; quote-safe for CI paths we control
            hits=($pat)
            for hit in "${hits[@]}"; do
              if [[ -e "$hit" || -L "$hit" ]]; then
                add_match "$hit"
              fi
            done
          fi
        done <<< "$PATHS"

        if [[ ${#matches[@]} -eq 0 ]]; then
          case "$IF_NONE" in
            error) echo "::error::no files at path"; exit 1 ;;
            warn)  echo "::warning::no files at path"; exit 0 ;;
            ignore) exit 0 ;;
          esac
        fi

        blob=""
        object=""
        if [[ ${#matches[@]} -eq 1 && -f "${matches[0]}" ]]; then
          blob="${matches[0]}"
          object="$(basename -- "$blob")"
        else
          object="${NAME}.tar"
          blob="${RUNNER_TEMP:-/tmp}/ak-${RANDOM}.tar"
          files=()
          for match in "${matches[@]}"; do
            if [[ -d "$match" ]]; then
              while IFS= read -r -d '' file; do files+=("$file"); done \
                < <(find -L "$match" -name '.*' -prune -o -type f -print0)
            else
              files+=("$match")
            fi
          done
          printf '%s\0' "${files[@]}" | tar -hcf "$blob" --null -T -
        fi

        repo_safe="${REPO//\//_}"
        # Keeper derives artifacts.version from the 2nd path segment
        # (derive_generic_path_coordinate); lifecycle exclusions match on it.
        key="${RUN_ID}/retain-${RETENTION_DAYS}d/${RUN_ATTEMPT}/${JOB}"
        [[ -n "$MATRIX_KEY" ]] && key="${key}/${MATRIX_KEY}"
        key="${key}/${NAME}/${object}"
        base="${ARTIFACT_KEEPER_URL%/}/api/v1/repositories/${repo_safe}"
        # Backend route (handlers/repositories.rs upload_artifact): raw body,
        # 201 Created, scope write:artifacts. /api/* is proxied by Caddy.
        put_url="${base}/artifacts/${key}"
        url="${base}/download/${key}"
        # Fail closed: url/key/name feed curl argv, GITHUB_OUTPUT and GITHUB_STEP_SUMMARY.
        if [[ "${url}${key}${NAME}" == *"${ARTIFACT_KEEPER_TOKEN}"* ]]; then
          echo "::error::Keeper token would leak into upload-raw request/outputs/summary"
          exit 1
        fi

        # Token goes to curl via stdin config (printf is a builtin), never argv.
        code=$(printf 'header = "Authorization: Bearer %s"\n' "$ARTIFACT_KEEPER_TOKEN" \
          | curl -sS -K - -o "${RUNNER_TEMP:-/tmp}/ak-upload-body" -w '%{http_code}' \
          -X PUT \
          -H 'Content-Type: application/octet-stream' \
          --data-binary @"${blob}" \
          "$put_url")
        case "$code" in
          2??) ;;
          *) echo "::error::Artifact Keeper PUT HTTP ${code}"; exit 1 ;;
        esac

        {
          echo "url=${url}"
          echo "key=${key}"
        } >> "$GITHUB_OUTPUT"
        {
          echo "### upload-raw"
          echo "- name: ${NAME}"
          echo "- retention-days: ${RETENTION_DAYS}"
          echo "- url: ${url}"
        } >> "$GITHUB_STEP_SUMMARY"
