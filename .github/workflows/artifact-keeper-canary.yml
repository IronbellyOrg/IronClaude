# Phase A canary. Dispatch only. Does not replace production upload-artifact steps.
# IronClaude adaptation (owner B3 2026-09-25): omit large_put ([self-hosted, big]) —
# this repo has no `big` runner. Coder source blob 602d4f41729bfc762ab711cfff4057d38ca1fa53.
name: artifact-keeper-canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auth_401:
    runs-on: self-hosted
    steps:
      - name: PUT without token must 401 or 403
        env:
          ARTIFACT_KEEPER_URL: ${{ secrets.ARTIFACT_KEEPER_URL }}
        run: |
          set +x
          set -euo pipefail
          [[ -n "${ARTIFACT_KEEPER_URL:-}" ]] || { echo "::error::ARTIFACT_KEEPER_URL missing"; exit 1; }
          host="${ARTIFACT_KEEPER_URL#*://}"
          host="${host%%/*}"
          case "$host" in
            *githubusercontent.com*|*github.com*) echo "::error::Keeper URL host is GitHub: $host"; exit 1 ;;
          esac
          repo="${GITHUB_REPOSITORY//\//_}"
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X PUT \
            -H 'Content-Type: application/octet-stream' --data-binary 'x' \
            "${ARTIFACT_KEEPER_URL%/}/api/v1/repositories/${repo}/artifacts/canary/${{ github.run_id }}/unauth.bin")
          echo "unauth HTTP $code"
          [[ "$code" == 401 || "$code" == 403 ]]

  empty_glob:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: nff=error must fail
        id: nff_error
        continue-on-error: true
        uses: ./.github/actions/upload-raw
        with:
          name: canary-empty-error-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/ak-canary-missing-error
          if-no-files-found: error
          retention-days: "1"
          keeper-url: ${{ secrets.ARTIFACT_KEEPER_URL }}
          keeper-token: ${{ secrets.ARTIFACT_KEEPER_TOKEN }}
      - name: assert nff=error failed
        run: test "${{ steps.nff_error.outcome }}" = "failure"
      - name: nff=warn must succeed
        uses: ./.github/actions/upload-raw
        with:
          name: canary-empty-warn-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/ak-canary-missing-warn
          if-no-files-found: warn
          retention-days: "1"
          keeper-url: ${{ secrets.ARTIFACT_KEEPER_URL }}
          keeper-token: ${{ secrets.ARTIFACT_KEEPER_TOKEN }}
      - name: nff=ignore must succeed
        uses: ./.github/actions/upload-raw
        with:
          name: canary-empty-ignore-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/ak-canary-missing-ignore
          if-no-files-found: ignore
          retention-days: "1"
          keeper-url: ${{ secrets.ARTIFACT_KEEPER_URL }}
          keeper-token: ${{ secrets.ARTIFACT_KEEPER_TOKEN }}
      - name: Create empty directory
        run: mkdir "${RUNNER_TEMP}/ak-empty-${{ github.run_id }}-${{ github.run_attempt }}"
      - name: nff=error rejects empty directory
        id: nff_empty_dir
        continue-on-error: true
        uses: ./.github/actions/upload-raw
        with:
          name: canary-empty-dir-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ak-empty-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: "1"
          keeper-url: ${{ secrets.ARTIFACT_KEEPER_URL }}
          keeper-token: ${{ secrets.ARTIFACT_KEEPER_TOKEN }}
      - name: assert empty directory rejected
        run: test "${{ steps.nff_empty_dir.outcome }}" = "failure"
      - name: Create hidden-only and mixed directories
        run: |
          mkdir "${RUNNER_TEMP}/ak-hidden-${{ github.run_id }}-${{ github.run_attempt }}" "${RUNNER_TEMP}/ak-visible-${{ github.run_id }}-${{ github.run_attempt }}"
          printf 'private\n' > "${RUNNER_TEMP}/ak-hidden-${{ github.run_id }}-${{ github.run_attempt }}/.hidden"
          printf 'private\n' > "${RUNNER_TEMP}/ak-visible-${{ github.run_id }}-${{ github.run_attempt }}/.hidden"
          printf 'public\n' > "${RUNNER_TEMP}/ak-visible-${{ github.run_id }}-${{ github.run_attempt }}/visible"
      - name: nff=error rejects hidden-only directory
        id: nff_hidden_dir
        continue-on-error: true
        uses: ./.github/actions/upload-raw
        with:
          name: canary-hidden-dir-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ak-hidden-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: "1"
          keeper-url: ${{ secrets.ARTIFACT_KEEPER_URL }}
          keeper-token: ${{ secrets.ARTIFACT_KEEPER_TOKEN }}
      - name: assert hidden-only directory rejected
        run: test "${{ steps.nff_hidden_dir.outcome }}" = "failure"
      - name: Upload directory with visible and hidden files
        id: visible_put
        uses: ./.github/actions/upload-raw
        with:
          name: canary-visible-dir-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ak-visible-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: "1"
          keeper-url: ${{ secrets.ARTIFACT_KEEPER_URL }}
          keeper-token: ${{ secrets.ARTIFACT_KEEPER_TOKEN }}
      - name: Verify archive excludes hidden file
        env:
          ARTIFACT_KEEPER_TOKEN: ${{ secrets.ARTIFACT_KEEPER_TOKEN }}
          URL: ${{ steps.visible_put.outputs.url }}
        run: |
          set +x
          set -euo pipefail
          printf 'header = "Authorization: Bearer %s"\n' "$ARTIFACT_KEEPER_TOKEN" \
            | curl -fsS -K - "$URL" -o "$RUNNER_TEMP/ak-visible.tar"
          tar -tf "$RUNNER_TEMP/ak-visible.tar" > "$RUNNER_TEMP/ak-visible-contents.txt"
          grep -qF '/visible' "$RUNNER_TEMP/ak-visible-contents.txt"
          ! grep -qF '/.hidden' "$RUNNER_TEMP/ak-visible-contents.txt"
          test "$(tar -xOf "$RUNNER_TEMP/ak-visible.tar" "${RUNNER_TEMP#/}/ak-visible-${{ github.run_id }}-${{ github.run_attempt }}/visible")" = public

  matrix_keys:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        cell: [a, b]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: printf 'cell-%s\n' '${{ matrix.cell }}' > "${RUNNER_TEMP}/ak-${{ matrix.cell }}.txt"
      - id: put
        uses: ./.github/actions/upload-raw
        with:
          name: canary-cell-${{ matrix.cell }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ak-${{ matrix.cell }}.txt
          if-no-files-found: error
          retention-days: "1"
          matrix-key: ${{ matrix.cell }}
          keeper-url: ${{ secrets.ARTIFACT_KEEPER_URL }}
          keeper-token: ${{ secrets.ARTIFACT_KEEPER_TOKEN }}
      - name: GET this cell
        env:
          ARTIFACT_KEEPER_TOKEN: ${{ secrets.ARTIFACT_KEEPER_TOKEN }}
          WANT: cell-${{ matrix.cell }}
          URL: ${{ steps.put.outputs.url }}
          KEY: ${{ steps.put.outputs.key }}
        run: |
          set +x
          set -euo pipefail
          # Same job as upload-raw: its outputs must not carry the token.
          if [[ "${URL}${KEY}" == *"${ARTIFACT_KEEPER_TOKEN}"* ]]; then
            echo "::error::token present in upload-raw outputs"
            exit 1
          fi
          [[ "$KEY" == */retain-1d/* ]] || { echo "::error::retention not encoded in key"; exit 1; }
          got=$(printf 'header = "Authorization: Bearer %s"\n' "$ARTIFACT_KEEPER_TOKEN" | curl -fsS -K - "$URL")
          [[ "$got" == "$WANT" ]]

  always_after_failure:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: printf 'after-fail\n' > "${RUNNER_TEMP}/ak-after-fail.txt"
      - name: expected failure
        id: boom
        continue-on-error: true
        run: "false"
      - id: put
        if: always()
        uses: ./.github/actions/upload-raw
        with:
          name: canary-after-fail-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ak-after-fail.txt
          if-no-files-found: error
          retention-days: "1"
          keeper-url: ${{ secrets.ARTIFACT_KEEPER_URL }}
          keeper-token: ${{ secrets.ARTIFACT_KEEPER_TOKEN }}
      - name: assert prior step failed and upload ran
        if: always()
        run: |
          test "${{ steps.boom.outcome }}" = "failure"
          test "${{ steps.put.outcome }}" = "success"
      - name: GET after-fail
        if: always()
        env:
          ARTIFACT_KEEPER_TOKEN: ${{ secrets.ARTIFACT_KEEPER_TOKEN }}
          URL: ${{ steps.put.outputs.url }}
        run: |
          set +x
          set -euo pipefail
          [[ -n "$URL" ]]
          got=$(printf 'header = "Authorization: Bearer %s"\n' "$ARTIFACT_KEEPER_TOKEN" | curl -fsS -K - "$URL")
          [[ "$got" == "after-fail" ]]

  get_identical:
    needs: [matrix_keys, always_after_failure]
    if: always()
    runs-on: self-hosted
    steps:
      # Token-in-summary is guarded inside upload-raw (fails closed before writing
      # GITHUB_OUTPUT/STEP_SUMMARY) and asserted on outputs in matrix_keys; a later
      # job cannot read another step's per-step summary file.
      - name: host is not GitHub artifact API
        env:
          ARTIFACT_KEEPER_URL: ${{ secrets.ARTIFACT_KEEPER_URL }}
        run: |
          set +x
          set -euo pipefail
          host="${ARTIFACT_KEEPER_URL#*://}"
          host="${host%%/*}"
          case "$host" in
            *githubusercontent.com*|*github.com*) echo "::error::Keeper URL host is GitHub: $host"; exit 1 ;;
          esac
