name: Tests

on:
  push:
    branches: [master, integration]
  pull_request:
    branches: [master, integration]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Verify UV installation
        run: uv --version

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          uv pip list --system

      - name: Verify package installation
        run: |
          python -c "import superclaude; print(f'SuperClaude {superclaude.__version__} installed')"
          python -c "import pytest_cov; print('pytest-cov is installed')"

      - name: Sync src/superclaude/ → .claude/ mirrors
        # Required: several audit tests assert byte-identical parity between
        # src/superclaude/{skills,agents,commands,hooks,templates} and the
        # .claude/ mirrors. Mirrors are gitignored, so CI must materialise them
        # before pytest runs.
        run: |
          make sync-dev

      - name: Run tests
        run: |
          pytest -v --tb=short --color=yes

      - name: Run tests with coverage
        if: matrix.python-version == '3.10'
        run: |
          pytest --cov=superclaude --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.10'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  swarm-marker-matrix:
    name: Swarm ${{ matrix.marker }} acceptance lane
    # T08.03 / NFR-007: exercises the per-IMM and per-INV swarm acceptance
    # matrix. Each marker selects the dedicated test files registered in
    # tests/swarm/conftest.py (IMM_COVERAGE_MAP / INV_COVERAGE_MAP).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        marker: ["imm", "inv"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Sync src/superclaude/ → .claude/ mirrors
        run: |
          make sync-dev

      - name: Run ${{ matrix.marker }} swarm lane
        run: |
          pytest tests/swarm/ -m ${{ matrix.marker }} -v --tb=short --color=yes

  lint:
    name: Lint and Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run ruff linter
        run: |
          ruff check src/ tests/

      - name: Check ruff formatting
        run: |
          ruff format --check src/ tests/

  plugin-check:
    name: Pytest Plugin Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Verify pytest plugin loaded
        run: |
          pytest --trace-config 2>&1 | grep -q "superclaude" && echo "✅ Plugin loaded successfully" || (echo "❌ Plugin not loaded" && exit 1)

      - name: Check available fixtures
        run: |
          pytest --fixtures | grep -E "(confidence_checker|self_check_protocol|reflexion_pattern|token_budget|pm_context)"

  verify-deps:
    name: Dependency Allow-list (AC3)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Verify dependency allow-list
        run: |
          make verify-deps

  doctor-check:
    name: SuperClaude Doctor Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install UV
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Run doctor command
        run: |
          superclaude doctor --verbose

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, swarm-marker-matrix, lint, plugin-check, doctor-check, verify-deps]
    if: always()

    steps:
      - name: Check test results
        run: |
          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "❌ Tests failed"
            exit 1
          fi
          if [ "${{ needs.swarm-marker-matrix.result }}" != "success" ]; then
            echo "❌ Swarm IMM/INV acceptance lanes failed"
            exit 1
          fi
          if [ "${{ needs.lint.result }}" != "success" ]; then
            echo "❌ Linting failed"
            exit 1
          fi
          if [ "${{ needs.plugin-check.result }}" != "success" ]; then
            echo "❌ Plugin check failed"
            exit 1
          fi
          if [ "${{ needs.doctor-check.result }}" != "success" ]; then
            echo "❌ Doctor check failed"
            exit 1
          fi
          if [ "${{ needs.verify-deps.result }}" != "success" ]; then
            echo "❌ Dependency allow-list check failed"
            exit 1
          fi
          echo "✅ All checks passed!"
