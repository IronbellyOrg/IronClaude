name: Tests

on:
  push:
    branches: [master, integration]
  pull_request:
    branches: [master, integration]
  workflow_dispatch:

jobs:
  test:
    name: Test on Python 3.10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.10
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.10"
          activate-environment: true

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"
          uv pip list

      - name: Sync src/superclaude/ → .claude/ mirrors
        # Required: several audit tests assert byte-identical parity between
        # src/superclaude/{skills,agents,commands,hooks,templates} and the
        # .claude/ mirrors. Mirrors are gitignored, so CI must materialise them
        # before pytest runs.
        run: |
          make sync-dev

      - name: Run tests with coverage
        run: |
          pytest -v --tb=short --color=yes --cov=superclaude --cov-report=xml --cov-report=term

  swarm-marker-matrix:
    name: Swarm ${{ matrix.marker }} acceptance lane
    # T08.03 / NFR-007: exercises the per-IMM and per-INV swarm acceptance
    # matrix. Each marker selects the dedicated test files registered in
    # tests/swarm/conftest.py (IMM_COVERAGE_MAP / INV_COVERAGE_MAP).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        marker: ["imm", "inv"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.10
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.10"
          activate-environment: true

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Sync src/superclaude/ → .claude/ mirrors
        run: |
          make sync-dev

      - name: Run ${{ matrix.marker }} swarm lane
        run: |
          pytest tests/swarm/ -m ${{ matrix.marker }} -v --tb=short --color=yes

  lint:
    name: Lint, Plugin, Sync and Dependency Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.10
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.10"
          activate-environment: true

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Run ruff linter
        run: |
          ruff check src/ tests/

      - name: Check ruff formatting
        run: |
          ruff format --check src/ tests/

      - name: Verify pytest plugin loaded
        run: |
          pytest --trace-config 2>&1 | grep -q "superclaude" && echo "✅ Plugin loaded successfully" || (echo "❌ Plugin not loaded" && exit 1)

      - name: Check available fixtures
        run: |
          pytest --fixtures | grep -E "(confidence_checker|self_check_protocol|reflexion_pattern|token_budget|pm_context)"

      - name: Verify dependency allow-list
        # Audit a separate uv.lock-resolved project env, not the activated [dev]
        # venv: `uv pip install -e ".[dev]"` ignores uv.lock and can pull
        # sub-dependencies outside scripts/dependency_baseline.txt.
        env:
          UV_PROJECT_ENVIRONMENT: ${{ runner.temp }}/verify-deps-venv
        run: |
          make verify-deps

      - name: Sync src/superclaude/ → .claude/ mirrors
        run: |
          make sync-dev

      - name: Verify component sync (src/ ↔ .claude/)
        run: |
          make verify-sync

      - name: Lint architecture policy
        run: |
          make lint-architecture

  doctor-check:
    name: SuperClaude Doctor Check
    runs-on: ubuntu-latest
    # `superclaude install` retires stale user-scope MCP registrations through the Claude CLI;
    # keep the token read-only and out of .git/config while it runs.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.10
        uses: astral-sh/setup-uv@v10.3.2
        with:
          python-version: "3.10"
          activate-environment: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `superclaude install` retires stale user-scope MCP registrations through the Claude CLI.
      - name: Install Claude CLI
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.286
          claude --version

      - name: Install dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Install native components
        run: |
          superclaude install

      - name: Run doctor command
        run: |
          superclaude doctor --verbose

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [test, swarm-marker-matrix, lint, doctor-check]
    if: always()

    steps:
      - name: Check test results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
