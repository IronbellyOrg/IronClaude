  - id: E8
    title: "PreToolUse serena matcher fires"
    category: hook-lifecycle
    requires: [mcp_server.serena]
    timeout_sec: 60
    isolation:
      home_strategy: ephemeral
    no_pty: skip
    # T05.13 / D-0092 — body shape per OQ-2 resolution (D-0082 §4).
    # E8 exercises the `mcp__serena__*` branch of the PreToolUse matcher
    # group `Edit|Write|mcp__serena__*` in hooks.json (script command
    # =freshness-pre-edit.sh, timeout=5). Three sibling evals fan out
    # across the three matcher branches per D-0082 §3 hook-surface
    # coverage map: E6 covers Edit (D-0090), E7 covers Write (D-0091),
    # E8 covers the `mcp__serena__*` prefix (this). E8 is the only one
    # of the trio that carries `requires: [mcp_server.serena]` —
    # soft-skip under `--no-mcp` or if the serena MCP server is
    # unreachable — because firing the matcher requires invoking a real
    # `mcp__serena__*` tool, which only exists when the serena MCP
    # server is connected to the claude session.
