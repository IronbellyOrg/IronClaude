          path: logs/freshness.jsonl
          exists: true
      - file:
          path: logs/freshness.jsonl
          exists: true
          contains: '"type":"pre_edit"'
      - file:
          path: logs/freshness.jsonl
          exists: true
          contains: '"matcher":"mcp__serena__replace_content"'
      - file:
          path: modified.txt
          exists: true
      - exit_code:
