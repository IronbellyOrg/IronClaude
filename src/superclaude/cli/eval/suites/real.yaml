    #     branches because they share the hook script; the matcher
    #     pin (next assertion) is what discriminates the Write branch
    #     from the sibling Edit / serena branches.
    #   - expects[2]: file(logs/freshness.jsonl, contains
    #     '"matcher":"Write"') — proves the Write branch of the
    #     `Edit|Write|mcp__serena__*` matcher group fired specifically
    #     (vs. the sibling Edit / serena branches covered by E6 / E8).
    #     Two-substring shape mirrors the E6 (D-0090) pattern and the
    #     E2.1-3 matcher-coverage triad (D-0086 §"Two-assertion shape
    #     ({event, tool})").
    #   - expects[3]: file.exists(written.txt) — proves the scratch
