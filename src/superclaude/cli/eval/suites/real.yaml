    # HOME; the asserted substrings are invariant across runs (the
    # `ts`, `session_id`, `tool_call_idx`, `recent_read_age_sec` fields
    # on the JSONL row are not asserted against). Three consecutive
    # runs yield identical EvalOutcome statuses.
    #
    # Telemetry gap (pre-existing, NOT introduced by T05.13):
    # freshness-pre-edit.sh (current revision at
    # src/superclaude/hooks/scripts/freshness-pre-edit.sh:108-119)
    # writes to `$HOME/.claude/logs/freshness-hook.jsonl` with a JSONL
    # envelope `{ts, event:"PreToolUse", tool:<tool_name>, path:...,
    # session_id:..., tool_call_idx:..., decision:..., reason:...}`. It
    # does NOT write to `$HOME/.claude/logs/freshness.jsonl`, and the
    # envelope fields are `event`/`tool` (not `type`/`matcher`). The
    # OQ-2 body shape lands verbatim per the same posture taken in
    # T05.07 / D-0087 §8.1, T05.08 / D-0088 §8.1, T05.09 / D-0089
