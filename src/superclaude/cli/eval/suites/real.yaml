    # OQ-2-frozen body shape (D-0082 §4 row E8 / decisions.md OQ-2):
    #   - inputs[0]: Write a scratch file `modified.txt` with content
    #     "before" so the subsequent serena call has a target to
    #     replace_content on (mirrors the E6 Write→Edit chain: serena's
    #     replace_content needs a pre-existing file). The seed Write
    #     also fires the PreToolUse hook on the Write matcher branch,
    #     but the assertion below pins the serena-branch substring
    #     specifically — co-firing on Write is harmless.
    #   - inputs[1]: prompt that triggers
    #     `mcp__serena__replace_content` on modified.txt to swap
    #     "before"→"after"; this is the call that fires the PreToolUse
    #     hook on the `mcp__serena__*` matcher branch — the surface
    #     this eval asserts.
    #   - inputs[2]: prompt "/quit" — clean session exit so
    #     `exit_code.equals(0)` can pin the PTY teardown contract
    #     (sibling pattern to E3 / E4 / E5 / E6 / E7).
    #   - expects[0]: file.exists(logs/freshness.jsonl) — proves the
    #     freshness event ledger was opened (by a prior SessionStart
    #     hook on the same spawn or by freshness-pre-edit.sh itself).
    #   - expects[1]: file(logs/freshness.jsonl, contains
    #     '"type":"pre_edit"') — proves a pre_edit-typed event row was
    #     emitted into the freshness ledger by freshness-pre-edit.sh.
    #     The `pre_edit` type label is shared across Edit/Write/serena
    #     branches because they share the hook script; the matcher
    #     pin (next assertion) is what discriminates the serena branch
    #     from the sibling Edit / Write branches.
    #   - expects[2]: file(logs/freshness.jsonl, contains
    #     '"matcher":"mcp__serena__replace_content"') — proves the
    #     `mcp__serena__*` branch of the `Edit|Write|mcp__serena__*`
    #     matcher group fired specifically (vs. the sibling Edit /
    #     Write branches covered by E6 / E7). Two-substring shape
    #     mirrors the E6 / E7 sibling pattern and the E2.1-3
    #     matcher-coverage triad (D-0086 §"Two-assertion shape
    #     ({event, tool})"). The asserted tool name
    #     `mcp__serena__replace_content` is one of multiple
    #     `mcp__serena__*` variants in the matcher (per D-0082 §4 row
    #     E8: "or other `mcp__serena__*` variant"); choosing
    #     replace_content keeps the body symmetric with E6's Edit
    #     branch (both modify an existing file's contents).
    #   - expects[3]: file.exists(modified.txt) — proves the scratch
    #     file persisted post-replace_content. Path resolves against
    #     ctx.home_path per _resolve_path (expect.py:79-91), i.e.
    #     <per-eval-HOME>/modified.txt.
    #   - expects[4]: exit_code.equals(0) — clean session exit on /quit.
    #     Expect.jsonl predicate filters (event_count / contains_event
    #     with `type=...` keyword args) require a Python callable
    #     (expect.py:269-369), not expressible in declarative YAML;
    #     following the E3 / E4 / E5 / E6 / E7 / E1 / E2.1-3 precedent,
    #     the event-fire assertion uses Expect.file with the JSONL
    #     substring as a sufficient proxy for `contains_event`.
    #
    # Capability tags: `[mcp_server.serena]` — distinguishes E8 from
    # its sibling E6 / E7 (`[]`). FR-CAP1 soft-skip path applies:
    # under `--no-mcp` E8 emits status=SKIPPED with skip_reason
    # populated and the matcher-coverage gate continues to recognise
    # serena as exercised (the gate counts authored evals; soft-skip
    # is not a gap).
    # Determinism (D-0082 §2.2): freshness-pre-edit.sh emits one
