# yaml-language-server: $schema=./suite.schema.json
#
# DOC-OQ3 / R-077 / D-0077 — exclusion set for ``--no-pty``.
#
# Every eval body in the "real" suite drives a Claude Code subprocess
# through the vendored PTY harness (design-spec §3 / §6); none of the
# current E1-E15 inventory has a non-PTY assertion path. The
# ``no_pty: skip`` tag below therefore appears on every eval and
# ``superclaude eval run --suite real --no-pty`` short-circuits the
# whole suite with status SKIPPED + skip_reason="--no-pty" before any
# HOME setup. The tag is per-eval (not suite-wide) so future
# logic-only evals can drop it and continue to run under --no-pty
# without manifest gymnastics.
#
# Eval bodies (inputs / expects) land in Phase 5 batches (T05.02+); the
# entries here are the M4-frozen exclusion-set scaffolding plus the
# minimal ``title`` / ``category`` / ``timeout_sec`` / ``isolation``
# metadata required for ``eval describe --suite real`` to render a
# stable inventory.
name: real
version: "1.0"
description: "15 real-world evals for IronClaude hooks + installer + verify-sync (PTY-driven; --no-pty skips the whole suite)."

defaults:
  per_eval_timeout_sec: 120
  per_eval_memory_mb: 512
  capture_tty: true
  keep_home_on_success: false

required_binaries:
  - { name: claude, min_version: "0.5.0", failure_mode: hard }
  - { name: make,                          failure_mode: hard }
  - { name: jq,                            failure_mode: hard }
  - { name: git,                           failure_mode: hard }

optional_capabilities:
  - { name: mcp_server.auggie,            gate_flag: "--no-mcp", failure_mode: skip }
  - { name: mcp_server.auggie-mcp,        gate_flag: "--no-mcp", failure_mode: skip }
  - { name: mcp_server.airis-mcp-gateway, gate_flag: "--no-mcp", failure_mode: skip }
  - { name: mcp_server.serena,            gate_flag: "--no-mcp", failure_mode: skip }
  - { name: mcp_server.tavily,            gate_flag: "--no-mcp", failure_mode: skip }

evals:
  - id: E1
    title: "auggie-first sticky lifecycle — set then clear"
    category: hook-lifecycle
    requires: [mcp_server.auggie]
    timeout_sec: 90
    isolation:
      home_strategy: ephemeral
    no_pty: skip
    # T05.02 / D-0083 — body shape. Hook contract (auggie-flag-clear.sh):
    # the PostToolUse hook ONLY emits `{"event":"sticky_cleared"}` to
    # logs/auggie-first.jsonl if state/auggie-first-pending/<sid>.txt
    # existed before the matched tool call. Asserting the JSONL event is
    # therefore a sufficient proxy for the "set then clear" lifecycle —
    # the literal file_absent(state/.../<sid>.txt) assertion is deferred
    # (needs session_id template substitution; see D-0083 §4).
    inputs:
      - prompt: "Use mcp__auggie__codebase-retrieval to summarise the auggie-flag-clear hook in src/superclaude/hooks/scripts/."
        expect_tool_call: mcp__auggie__codebase-retrieval
    expects:
      - file:
          path: logs/auggie-first.jsonl
          exists: true
          contains: '"event":"sticky_cleared"'
      - exit_code:
          equals: 0

  # E2.1 / E2.2 / E2.3 — auggie matcher-coverage trio. T05.03 authors
  # E2.1 with its full body; T05.04 / T05.05 land E2.2 / E2.3 bodies.
  # OQ-2 (D-0082 §3 hook-surface coverage map) freezes E2.1-3 as the
  # static coverage triad for the PostToolUse `mcp__auggie__.*|mcp__auggie-mcp__.*|mcp__airis-mcp-gateway__auggie_.*`
  # matcher. Splitting the original E2 parameterize block into three
  # static entries (vs. one ``parameterize:`` row) is mandated by two
  # v1 constraints: (a) per-entry `requires:` capability tags differ
  # (FR-CAP1 — D-0082 §6), and (b) no runtime template-substitution
  # layer exists for `{{prefix}}` tokens in inputs/expects (per
  # loader._expand_entry docstring at loader.py:600).
  - id: E2.1
    title: "auggie matcher coverage — mcp__auggie__*"
    category: hook-coverage
    requires: [mcp_server.auggie]
    timeout_sec: 90
    isolation:
      home_strategy: ephemeral
    no_pty: skip
    # T05.03 / D-0084 — body shape. E2.1 covers the `mcp__auggie__.*`
    # branch of the PostToolUse matcher (hooks.json) by issuing a real
    # `mcp__auggie__codebase-retrieval` call. The `auggie-flag-clear.sh`
    # hook (scripts/auggie-flag-clear.sh:22-32) records the matched tool
    # name in the `tool` field of the JSONL event when the sticky
    # pre-existed, so asserting `"tool":"mcp__auggie__codebase-retrieval"`
    # in `logs/auggie-first.jsonl` proves the matcher branch fired for
    # the `mcp__auggie__*` prefix specifically (vs. the sibling auggie-mcp
    # / airis-mcp-gateway prefixes covered by E2.2 / E2.3).
    inputs:
      - prompt: "Use mcp__auggie__codebase-retrieval to summarise the auggie-flag-clear hook in src/superclaude/hooks/scripts/."
        expect_tool_call: mcp__auggie__codebase-retrieval
    expects:
      - file:
          path: logs/auggie-first.jsonl
          exists: true
          contains: '"event":"sticky_cleared"'
      - file:
          path: logs/auggie-first.jsonl
          exists: true
          contains: '"tool":"mcp__auggie__codebase-retrieval"'
      - exit_code:
          equals: 0

  - id: E2.2
    title: "auggie matcher coverage — mcp__auggie-mcp__*"
    category: hook-coverage
    requires: [mcp_server.auggie-mcp]
    timeout_sec: 90
    isolation:
      home_strategy: ephemeral
    no_pty: skip
    # T05.04 / D-0085 — body shape. E2.2 covers the `mcp__auggie-mcp__.*`
    # branch of the PostToolUse matcher (hooks.json) by issuing a real
    # `mcp__auggie-mcp__ask_question` call. Same JSONL contract as E2.1:
    # the `tool` field on the `sticky_cleared` event records the matched
    # tool name, so asserting `"tool":"mcp__auggie-mcp__ask_question"` in
    # `logs/auggie-first.jsonl` proves the matcher branch fired for the
    # `mcp__auggie-mcp__*` prefix specifically (vs. the sibling auggie /
    # airis-mcp-gateway prefixes covered by E2.1 / E2.3).
    inputs:
      - prompt: "Use mcp__auggie-mcp__ask_question to summarise the auggie-flag-clear hook in src/superclaude/hooks/scripts/."
        expect_tool_call: mcp__auggie-mcp__ask_question
    expects:
      - file:
          path: logs/auggie-first.jsonl
          exists: true
          contains: '"event":"sticky_cleared"'
      - file:
          path: logs/auggie-first.jsonl
          exists: true
          contains: '"tool":"mcp__auggie-mcp__ask_question"'
      - exit_code:
          equals: 0

  - id: E2.3
    title: "auggie matcher coverage — mcp__airis-mcp-gateway__auggie_*"
    category: hook-coverage
    requires: [mcp_server.airis-mcp-gateway]
    timeout_sec: 90
    isolation:
      home_strategy: ephemeral
    no_pty: skip
    # T05.05 / D-0086 — body shape. E2.3 covers the
    # `mcp__airis-mcp-gateway__auggie_.*` branch of the PostToolUse
    # matcher (hooks.json) by issuing a real
    # `mcp__airis-mcp-gateway__auggie_search` call. Same JSONL contract
    # as E2.1 / E2.2: the `tool` field on the `sticky_cleared` event
    # records the matched tool name, so asserting
    # `"tool":"mcp__airis-mcp-gateway__auggie_search"` in
    # `logs/auggie-first.jsonl` proves the matcher branch fired for the
    # `mcp__airis-mcp-gateway__auggie_*` prefix specifically (vs. the
    # sibling auggie / auggie-mcp prefixes covered by E2.1 / E2.2).
    # Note the trailing `auggie_` in the matcher: only gateway tools
    # whose name starts with `auggie_` (e.g. `auggie_search`,
    # `auggie_history`) fire this branch — generic gateway tools
    # (`tavily_search`, `context7_*`) do not.
    inputs:
      - prompt: "Use mcp__airis-mcp-gateway__auggie_search to summarise the auggie-flag-clear hook in src/superclaude/hooks/scripts/."
        expect_tool_call: mcp__airis-mcp-gateway__auggie_search
    expects:
      - file:
          path: logs/auggie-first.jsonl
          exists: true
          contains: '"event":"sticky_cleared"'
      - file:
          path: logs/auggie-first.jsonl
          exists: true
          contains: '"tool":"mcp__airis-mcp-gateway__auggie_search"'
      - exit_code:
          equals: 0

  - id: E3
    title: "SessionStart unmatched (session-init) hook fires"
    category: hook-lifecycle
    timeout_sec: 60
    isolation:
      home_strategy: ephemeral
    no_pty: skip
    # T05.07 / D-0087 — body shape per OQ-2 resolution (D-0082 §4).
    # E3 exercises the FIRST SessionStart hook entry in hooks.json
    # (no matcher, command=session-init.sh) — distinct from the second
    # SessionStart entry (matcher=*, freshness-session-start.sh) which
    # is covered by E4. Spawning a fresh claude session via the PTY
    # harness triggers both SessionStart hooks before prompt-ready;
    # the first-position hook is responsible for emitting the
    # session_init telemetry into the per-eval HOME.
    #
    # OQ-2-frozen body shape (D-0082 §4 / spec.md §3):
    #   - inputs: spawn fresh claude session; /quit to exit cleanly.
    #   - expects[0]: file.exists(state/session-init.log) — proves the
    #     first-position SessionStart hook ran (script writes its own
    #     log into the per-eval HOME under $HOME/.claude/state/).
    #   - expects[1]: file(logs/session-events.jsonl, contains
    #     '"type":"session_init"') — proves the session_init event was
    #     emitted into the SessionStart event ledger. Expect.jsonl
    #     with predicate filters requires a Python callable
    #     (expect.py:269-369), not expressible in YAML — so the
    #     event-fire assertion uses Expect.file with the JSONL
    #     substring, same pattern E1 / E2.1-3 use for their
    #     sticky_cleared assertions on logs/auggie-first.jsonl.
    #   - expects[2]: exit_code.equals(0) — clean session exit on /quit.
    #
    # No capability tags; no MCP; no network — runs on every host.
    # Determinism (D-0082 §2.2): every PTY spawn writes a new session
    # log + JSONL event with a fresh `ts` field that is not asserted
    # against, so the body passes/fails the same way every run on a
    # clean per-eval HOME (FR-ISO2).
    inputs:
      - prompt: "/quit"
    expects:
      - file:
          path: state/session-init.log
          exists: true
      - file:
          path: logs/session-events.jsonl
          exists: true
          contains: '"type":"session_init"'
      - exit_code:
          equals: 0

  - id: E4
    title: "SessionStart matcher=* freshness hook fires"
    category: hook-lifecycle
    timeout_sec: 60
    isolation:
      home_strategy: ephemeral
    no_pty: skip
    # T05.08 / D-0088 — body shape per OQ-2 resolution (D-0082 §4).
    # E4 exercises the SECOND SessionStart hook entry in hooks.json
    # (matcher=*, command=freshness-session-start.sh) — distinct from
    # the first-position SessionStart entry (no matcher,
    # session-init.sh) which is covered by E3. Both SessionStart hooks
    # fire before prompt-ready on a fresh PTY spawn; E3 pins the
    # position-0 hook's side-effects and E4 pins position-1.
    #
    # OQ-2-frozen body shape (D-0082 §4 / decisions.md OQ-2):
    #   - inputs: spawn fresh claude session; /quit to exit cleanly
    #     (identical input shape to E3 — same spawn triggers both
    #     SessionStart hooks).
    #   - expects[0]: file.exists(logs/freshness.jsonl) — proves the
    #     freshness event ledger was opened by the matcher=* hook.
    #   - expects[1]: file(logs/freshness.jsonl, contains
    #     '"type":"session_start"') — proves the session_start event
    #     was emitted into the freshness ledger by freshness-session-
    #     start.sh. Expect.jsonl predicate filters require a Python
    #     callable (expect.py:269-369), not expressible in declarative
    #     YAML; following the E3 / E1 / E2.1-3 precedent, the
    #     event-fire assertion uses Expect.file with the JSONL
    #     substring. The D-0082 §4 `event_count == 1` aspect is the
    #     same kind of count assertion that requires a callable —
    #     deferred to a follow-up under the YAML callback escape
    #     hatch (D-4) if duplicate-fire detection becomes load-bearing.
    #   - expects[2]: exit_code.equals(0) — clean session exit on /quit.
    #
    # No capability tags; no MCP; no network — runs on every host.
    # Determinism (D-0082 §2.2): every PTY spawn writes a new
    # freshness.jsonl entry with a fresh `ts` field that is not
    # asserted against, so the body passes/fails the same way on a
    # clean per-eval HOME (FR-ISO2).
    #
    # Telemetry gap (pre-existing, NOT introduced by T05.08):
    # freshness-session-start.sh (current revision at
    # src/superclaude/hooks/scripts/) emits the SessionStart envelope
    # to stdout via `jq -nc ... hookSpecificOutput ...` but does NOT
    # currently append a `{"type":"session_start"}` row to
    # $HOME/.claude/logs/freshness.jsonl. The OQ-2 body shape lands
    # verbatim per the same posture taken in T05.07 / D-0087 §8.1;
    # a follow-up hook-script update task is responsible for wiring
    # the freshness ledger emission. Acceptance criteria for T05.08
    # are met by describe / list / Expect.from_mapping round-trip
    # evidence (see TASKLIST_ROOT/evidence/T05.08/).
    inputs:
      - prompt: "/quit"
    expects:
      - file:
          path: logs/freshness.jsonl
          exists: true
      - file:
          path: logs/freshness.jsonl
          exists: true
          contains: '"type":"session_start"'
      - exit_code:
          equals: 0

  - id: E5
    title: "UserPromptSubmit freshness hook fires"
    category: hook-lifecycle
    timeout_sec: 60
    isolation:
      home_strategy: ephemeral
    no_pty: skip
    # T05.09 / D-0089 — body shape per OQ-2 resolution (D-0082 §4).
    # E5 exercises the sole UserPromptSubmit hook entry in hooks.json
    # (no matcher, command=freshness-user-prompt.sh, timeout=3) —
    # distinct from the two SessionStart hooks (E3 covers position-0
    # session-init.sh; E4 covers position-1 matcher=*
    # freshness-session-start.sh). UserPromptSubmit fires once per
    # user prompt submission; the eval injects a content prompt
    # ("echo test" per D-0082 §4) so the hook fires at least once
    # before the session exits on /quit.
    #
    # OQ-2-frozen body shape (D-0082 §4 row E5):
    #   - inputs[0]: prompt "echo test" — the injected content prompt
    #     that fires UserPromptSubmit; matches the D-0082 §4
    #     inject_prompt("echo test") shape verbatim.
    #   - inputs[1]: prompt "/quit" — clean session exit so
    #     exit_code.equals(0) can pin the PTY teardown contract
    #     (sibling pattern to E3 / E4).
    #   - expects[0]: file.exists(logs/freshness.jsonl) — proves the
    #     freshness event ledger was opened by the UserPromptSubmit
    #     hook (or a prior SessionStart hook on the same spawn).
    #   - expects[1]: file(logs/freshness.jsonl, contains
    #     '"type":"user_prompt"') — proves the user_prompt event row
    #     was emitted into the freshness ledger by
    #     freshness-user-prompt.sh. Expect.jsonl predicate filters
    #     require a Python callable (expect.py:269-369), not
    #     expressible in declarative YAML; following the E3 / E4 /
    #     E1 / E2.1-3 precedent, the event-fire assertion uses
    #     Expect.file with the JSONL substring. The D-0082 §4
    #     `event_count >= 1 per injected prompt` aspect is the same
    #     kind of count assertion that requires a callable — deferred
    #     to a follow-up under the YAML callback escape hatch (D-4)
    #     if per-prompt event-count discrimination becomes
    #     load-bearing.
    #   - expects[2]: exit_code.equals(0) — clean session exit on /quit.
    #
    # No capability tags; no MCP; no network — runs on every host.
    # Determinism (D-0082 §2.2): freshness-user-prompt.sh emits one
    # user_prompt row per UserPromptSubmit fire on a clean per-eval
    # HOME; the asserted substring is invariant across runs (the
    # `ts`, `session_id`, `turn` fields on the JSONL row are not
    # asserted against). Three consecutive runs yield identical
    # EvalOutcome statuses.
    #
    # Telemetry gap (pre-existing, NOT introduced by T05.09):
    # freshness-user-prompt.sh (current revision at
    # src/superclaude/hooks/scripts/) emits the UserPromptSubmit
    # envelope to stdout via `jq -nc ... hookSpecificOutput ...`
    # (lines 259-264) and writes truncation telemetry to
    # logs/freshness-hook.jsonl when triggered, but does NOT
    # currently append a `{"type":"user_prompt"}` row to
    # $HOME/.claude/logs/freshness.jsonl on the normal (non-truncated)
    # path. The OQ-2 body shape lands verbatim per the same posture
    # taken in T05.07 / D-0087 §8.1 and T05.08 / D-0088 §8.1; a
    # follow-up hook-script update task is responsible for wiring
    # the freshness ledger emission. Acceptance criteria for T05.09
    # are met by describe / list / Expect.from_mapping round-trip
    # evidence (see TASKLIST_ROOT/evidence/T05.09/).
    inputs:
      - prompt: "echo test"
      - prompt: "/quit"
    expects:
      - file:
          path: logs/freshness.jsonl
          exists: true
      - file:
          path: logs/freshness.jsonl
          exists: true
          contains: '"type":"user_prompt"'
      - exit_code:
          equals: 0

  - id: E6
    title: "PreToolUse Edit matcher fires"
    category: hook-lifecycle
    timeout_sec: 60
    isolation:
      home_strategy: ephemeral
    no_pty: skip
    # T05.10 / D-0090 — body shape per OQ-2 resolution (D-0082 §4).
    # E6 exercises the Edit branch of the PreToolUse matcher group
    # `Edit|Write|mcp__serena__*` in hooks.json (script command
    # =freshness-pre-edit.sh, timeout=5). Three sibling evals fan out
    # across the three matcher branches per D-0082 §3 hook-surface
    # coverage map: E6 covers Edit (this), E7 covers Write, E8 covers
    # the `mcp__serena__*` prefix (E8 carries `requires: [mcp_server.serena]`
    # for soft-skip under --no-mcp; E6 / E7 run on every host).
    #
    # OQ-2-frozen body shape (D-0082 §4 row E6 / decisions.md OQ-2):
    #   - inputs: spawn fresh claude session; inject a prompt that
    #     triggers a single Edit tool call against a scratch file
    #     (`edited.txt` under the per-eval HOME); /quit to exit cleanly.
    #     A preceding Write prompt seeds the scratch file so the agent
    #     has a target to Edit (freshness-pre-edit.sh's `no_prior_read`
    #     branch falls open on a not-yet-existing path per the script
    #     comment "create_allowed" at lines 78-87, so the seeding Write
    #     succeeds without a prior Read; the subsequent Edit then fires
    #     the PreToolUse hook on the Edit matcher branch — which is the
    #     surface this eval asserts).
    #   - expects[0]: file.exists(logs/freshness.jsonl) — proves the
    #     freshness event ledger was opened (by a prior SessionStart
    #     hook on the same spawn or by freshness-pre-edit.sh itself).
    #   - expects[1]: file(logs/freshness.jsonl, contains
    #     '"type":"pre_edit"') — proves a pre_edit-typed event row was
    #     emitted into the freshness ledger by freshness-pre-edit.sh.
    #   - expects[2]: file(logs/freshness.jsonl, contains
    #     '"matcher":"Edit"') — proves the Edit branch of the
    #     `Edit|Write|mcp__serena__*` matcher group fired specifically
    #     (vs. the sibling Write / serena branches covered by E7 / E8).
    #     Two-substring shape mirrors the E2.1-3 matcher-coverage triad
    #     (D-0086 §"Two-assertion shape ({event, tool})").
    #   - expects[3]: file.exists(edited.txt) — proves the scratch file
    #     persisted post-Edit. Path resolves against ctx.home_path per
    #     _resolve_path (expect.py:79-91), i.e. <per-eval-HOME>/edited.txt.
    #   - expects[4]: exit_code.equals(0) — clean session exit on /quit.
    #     Expect.jsonl predicate filters (event_count / contains_event
    #     with `type=...` keyword args) require a Python callable
    #     (expect.py:269-369), not expressible in declarative YAML;
    #     following the E3 / E4 / E5 / E1 / E2.1-3 precedent, the
    #     event-fire assertion uses Expect.file with the JSONL substring
    #     as a sufficient proxy for `contains_event`.
    #
    # No capability tags; no MCP; no network — runs on every host.
    # Determinism (D-0082 §2.2): freshness-pre-edit.sh emits one
    # PreToolUse row per matched tool invocation on a clean per-eval
    # HOME; the asserted substrings are invariant across runs (the
    # `ts`, `session_id`, `tool_call_idx`, `recent_read_age_sec` fields
    # on the JSONL row are not asserted against). Three consecutive
    # runs yield identical EvalOutcome statuses.
    #
    # Telemetry gap (pre-existing, NOT introduced by T05.10):
    # freshness-pre-edit.sh (current revision at
    # src/superclaude/hooks/scripts/freshness-pre-edit.sh:108-119)
    # writes to `$HOME/.claude/logs/freshness-hook.jsonl` with a JSONL
    # envelope `{ts, event:"PreToolUse", tool:<tool_name>, path:...,
    # session_id:..., tool_call_idx:..., decision:..., reason:...}`. It
    # does NOT write to `$HOME/.claude/logs/freshness.jsonl`, and the
    # envelope fields are `event`/`tool` (not `type`/`matcher`). The
    # OQ-2 body shape lands verbatim per the same posture taken in
    # T05.07 / D-0087 §8.1, T05.08 / D-0088 §8.1, and T05.09 / D-0089
    # §8.1; a follow-up hook-script update task is responsible for
    # wiring the freshness-ledger emission with the OQ-2-contract field
    # names. Acceptance criteria for T05.10 are met by describe / list /
    # Expect.from_mapping round-trip evidence (see
    # TASKLIST_ROOT/evidence/T05.10/).
    inputs:
      - prompt: "Use the Write tool to create a file named edited.txt under the current working directory with the single line 'before'."
      - prompt: "Use the Edit tool on edited.txt to replace 'before' with 'edited'."
      - prompt: "/quit"
    expects:
      - file:
          path: logs/freshness.jsonl
          exists: true
      - file:
          path: logs/freshness.jsonl
          exists: true
          contains: '"type":"pre_edit"'
      - file:
          path: logs/freshness.jsonl
          exists: true
          contains: '"matcher":"Edit"'
      - file:
          path: edited.txt
          exists: true
      - exit_code:
          equals: 0

  - id: E7
    title: "PreToolUse Write matcher fires"
    category: hook-lifecycle
    timeout_sec: 60
    isolation:
      home_strategy: ephemeral
    no_pty: skip
    # T05.11 / D-0091 — body shape per OQ-2 resolution (D-0082 §4).
    # E7 exercises the Write branch of the PreToolUse matcher group
    # `Edit|Write|mcp__serena__*` in hooks.json (script command
    # =freshness-pre-edit.sh, timeout=5). Three sibling evals fan out
    # across the three matcher branches per D-0082 §3 hook-surface
    # coverage map: E6 covers Edit, E7 covers Write (this), E8 covers
    # the `mcp__serena__*` prefix (E8 carries `requires: [mcp_server.serena]`
    # for soft-skip under --no-mcp; E6 / E7 run on every host).
    #
    # OQ-2-frozen body shape (D-0082 §4 row E7 / decisions.md OQ-2):
    #   - inputs: spawn fresh claude session; inject a prompt that
    #     triggers a single Write tool call against a scratch file
    #     (`written.txt` under the per-eval HOME); /quit to exit cleanly.
    #     Unlike E6, no seed prompt is required — Write creates a
    #     new file directly, and freshness-pre-edit.sh's `no_prior_read`
    #     branch falls open on a not-yet-existing path (the
    #     `create_allowed` route at lines 78-87 of the script) which
    #     is the natural path for a single Write that fires the
    #     PreToolUse hook on the Write matcher branch — which is the
    #     surface this eval asserts.
    #   - expects[0]: file.exists(logs/freshness.jsonl) — proves the
    #     freshness event ledger was opened (by a prior SessionStart
    #     hook on the same spawn or by freshness-pre-edit.sh itself).
    #   - expects[1]: file(logs/freshness.jsonl, contains
    #     '"type":"pre_edit"') — proves a pre_edit-typed event row was
    #     emitted into the freshness ledger by freshness-pre-edit.sh.
