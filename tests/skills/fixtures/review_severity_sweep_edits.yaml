# sweep-edits.yaml: literal, mechanically checkable edit table for the review severity rule (sweep rows).
#
# Date: 2026-11-02. Branch: fix/review-severity-rule (HEAD f90877be; src unmodified; line numbers verified on disk today).
# Rule applied (S1/S2): grade every finding as blocking (CRITICAL / IMPORTANT: wrong, unsafe, incomplete against stated
# requirements, or unverifiable) or minor (MINOR / LOW: cosmetic, wording, style, optional polish). Only blocking findings
# fail a review; minor findings are recorded as notes, are not rechecked, and never trigger a fix pass on their own.
# At the cap, open blocking findings HALT and escalate to the user (cap numbers and at-cap clauses live in cap-edits.yaml).
# Inputs: .dev/review-severity-rule/sweep/fixloop-hits.tsv (scanner: sweep/fixloop_scan.py),
# .dev/reflect/pre-removeTheAnyIssu-20261102054021/adversarial/merged-verdict.md (B3-01, B3-02, B3-03, B3-04, B3-07, B3-10).
#
# Row contract (same as cap-edits.yaml; check each row mechanically):
#   - `old` is a literal substring of `file`; `grep -n -F -- "<old>" <file>` hits only the listed line(s) and the number of
#     matches equals `occurrences` (every row here has occurrences 1).
#   - No `old` occurrence shares any character position with a cap-edits.yaml `old` occurrence in the same file, so the two
#     tables apply in either order.
#   - `new` never contains `old`. After applying: count(old) == 0 and count(new) >= 1 in `file`.
#   - Multi-line `old` (verdict PASS+FAIL pairs, the agent_template_qa Fix Cycle block, two short anchors) uses YAML "\n"
#     escapes and lists every spanned line in `lines`.
#   - Every `fixloop` row's `new` contains "blocking".
#   - Not covered here (owned by other tasks): prd/refs/build-request-template.md:157, tdd/refs/build-request-template.md:152,
#     task-builder/SKILL.md:1600, task/SKILL.md:347, every line in inventory.md sections 2.2-2.5, and the pm-agent example
#     lines (agents/sc-pm-agent.md:541, src/superclaude/agents/pm-agent.md:564, plugins/superclaude/agents/pm-agent.md:564).
# Groups (fixloop 96, verdict 14, halt 2, template-qa 1, reflect-gate 5, tasklist 12, zero-tolerance 5):
#   fixloop        fix passes and repeat triggers carry blocking findings only (finding B3-03 for its 8 site sets, else sweep)
#   verdict        "FAIL: Issues found" -> "FAIL: Blocking issues found"; PASS allows MINOR notes (B3-07)
#   halt           rf-qa HALT-MONOTONICITY counts blocking issues only (B3-01)
#   template-qa    agent_template_qa.md Fix Cycle rechecks previously failed blocking items only (B3-02)
#   reflect-gate   task-builder POST reflect gate: Regression / unauthorized Drift is remediated or HALTs and escalates (B3-04)
#   tasklist       sc-tasklist-protocol Stages 8-10: Low findings are notes; open High/Medium findings HALT at the cap (B3-10)
#   zero-tolerance QA prompt intros: zero tolerance applies to blocking errors (sweep)
