# yaml-language-server: $schema=../../../../src/superclaude/cli/eval/suites/suite.schema.json
# T05.25 / D-0102 fixture: minimal suite covering the three v1 MCP matcher
# families (auggie, auggie-mcp, airis-mcp-gateway). Loaded by
# tests/cli/eval/test_coverage_gate_integration.py to drive the doctor
# --check-coverage and `eval run` coverage-gate code paths.
name: coverage-gate-fixture
version: "1.0"
description: "Three-eval fixture asserting one tool-call per v1 MCP prefix."

defaults:
  per_eval_timeout_sec: 60
  per_eval_memory_mb: 256
  capture_tty: false
  keep_home_on_success: false

required_binaries: []

optional_capabilities: []

evals:
  - id: E1
    title: "auggie prefix coverage"
    category: hook-lifecycle
    inputs:
      - expect_tool_call: mcp__auggie__codebase-retrieval

  - id: E2
    title: "auggie-mcp prefix coverage"
    category: hook-lifecycle
    inputs:
      - expect_tool_call: mcp__auggie-mcp__ask_question

  - id: E3
    title: "airis-mcp-gateway prefix coverage"
    category: hook-lifecycle
    inputs:
      - expect_tool_call: mcp__airis-mcp-gateway__auggie_search
