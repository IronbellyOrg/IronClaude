# SuperClaude Framework - Pre-commit Hooks
# See https://pre-commit.com for more information

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']  # Allow custom YAML tags
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  # Secret detection (critical for security)
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args:
          - '--baseline'
          - '.secrets.baseline'
        exclude: |
          (?x)^(
            .*\.lock$|
            .*package-lock\.json$|
            .*pnpm-lock\.yaml$|
            .*\.min\.js$|
            .*\.min\.css$
          )$

  # Additional secret patterns (from CLAUDE.md)
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: detect-private-key
        exclude: |
          (?x)^(
            \.dev/releases/archive/.*|
            \.dev/releases/backlog/.*|
            \.dev/releases/complete/.*
          )$
      - id: check-yaml
        name: Check for hardcoded secrets
        entry: |
          bash -c '
          if grep -rE "(sk_live_[a-zA-Z0-9]{24,}|pk_live_[a-zA-Z0-9]{24,}|sk_test_[a-zA-Z0-9]{24,}|pk_test_[a-zA-Z0-9]{24,}|SUPABASE_SERVICE_ROLE_KEY\s*=\s*[^[:space:]]*eyJ|SUPABASE_ANON_KEY\s*=\s*[^[:space:]]*eyJ|NEXT_PUBLIC_SUPABASE_ANON_KEY\s*=\s*[^[:space:]]*eyJ|OPENAI_API_KEY\s*=\s*[^[:space:]]*sk-|TWILIO_AUTH_TOKEN\s*=\s*[^[:space:]]*[a-f0-9]{32}|INFISICAL_TOKEN\s*=\s*[^[:space:]]*st\.|DATABASE_URL\s*=\s*[^[:space:]]*postgres.*@.*:.*/.*(password|passwd))" "$@" 2>/dev/null; then
            echo "🚨 BLOCKED: Hardcoded secrets detected!"
            echo "Replace with placeholders: your_token_here, \${VAR_NAME}, etc."
            exit 1
          fi
          '

  # Conventional Commits validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  # Markdown linting
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.38.0
    hooks:
      - id: markdownlint
        args: ['--fix']
        exclude: |
          (?x)^(
            CHANGELOG\.md|
            .*node_modules.*|
            .*\.min\.md$|
            \.dev/.*
          )$

  # YAML linting
  - repo: https://github.com/adrienverge/yamllint
    rev: v1.33.0
    hooks:
      - id: yamllint
        args: ['-d', '{extends: default, rules: {line-length: disable, document-start: disable, braces: disable, commas: disable}}']

  # Shell script linting
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.9.0.6
    hooks:
      - id: shellcheck
        args: ['--severity=warning']

  # AC11 / R-017 / T01.20 — source-of-truth discipline gate
  # Rejects generated `.claude/` mirrors on the commit path. Full mirror drift
  # remains available via `make verify-sync`, but pre-commit must not require
  # staging generated mirrors when this repository edits its own src/ sources.
  - repo: local
    hooks:
      - id: block-claude-generated-mirrors
        name: Block generated .claude mirror commits (AC11)
        entry: scripts/precommit_block_claude_mirrors.sh
        language: script
        pass_filenames: false
        files: '^\.claude/(skills|agents|commands|hooks|templates)/'

# Global settings
default_stages: [commit]
fail_fast: false
