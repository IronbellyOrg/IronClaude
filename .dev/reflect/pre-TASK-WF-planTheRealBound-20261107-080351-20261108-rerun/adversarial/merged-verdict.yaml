    claim: >-
      The plan says per-case cleanup "never signals a surviving job or its supervisor" yet also that timeout and teardown sweep /proc by working directory and stop each match, and the self-check requires "a timeout kills the whole process group"; a timeout in the resume or fork run would kill the old child and mislabel later cases "job did not survive the first Claude process ending". A setsid daemon that changes directory also escapes the cwd sweep.
    citations: ["plan:31", "plan:35", "plan:55-60", "plan:66", "plan:71", "helper:292"]
    recommendation: >-
      Exempt registered survivors from timeout sweeps (only the explicit teardown stops them); label a runner-caused stop differently from a harness-caused loss; add a self-check that times out a dependent run while the survivor stays alive; teardown also stops every pid recorded in ready files and case artifacts after a start-ticks check.
    provenance:
      source_findings: [N-3, A-01, Q-6]
      tag: "Source: Variant 2 (base) Q-6, N-3 + Variant 1 A-01; merged per Change #3 (C-001 tie, 85)"

  - id: M2-02
    severity: MEDIUM
    claim: >-
      Every real run is capped with --max-budget-usd 0.25, but Task 3 requires a pty-driven interactive session and the archived CLI help says the option "only works with --print"; live_probe's argv carries --disable-slash-commands, which would likely disable /clear [INFERRED].
    citations: ["plan:22", "plan:55", "help:131-132", "live_probe:228-255 (the :253 flag)"]
    recommendation: >-
      Owner decision before execution: either record the pty /clear case unavailable under the existing cap, or authorize a separately bounded interactive run (bounded timeout, single scripted turn, stated cost bound, no --disable-slash-commands).
    provenance:
      source_findings: [N-4, A-02]
      tag: "Source: Variant 1 A-02 replacing Variant 2 (base) N-4 row; merged per Change #2 (C-002 agreed, 92)"

  - id: M2-03
    severity: MEDIUM
    claim: >-
      Task 3 does not establish how the /clear reused-process case is set up: it SIGKILLs the first Claude process and starts a different pty process, so the controller that originated the governed job is not reused; the starting identity and the expected status of each call before and after /clear are unstated, and the fork's expected status is unstated (a fork gets a new session id with no record, so it is ordinary). The session id carried by the hook event is recorded but no capture interface is named.
    citations: ["plan:55", "plan:58", "plan:59", "design:504", "helper:429-437", "help:104-106"]
    recommendation: >-
      State the controller identity before and after /clear; order the calls start-as-governed, Bash (expected governed), /clear, Bash (expected ordinary) while the old child lives; state the expected fork status; name how the event's session id is captured; if the topology cannot be driven record the reused-process form unavailable with the interface named.
    provenance:
      source_findings: [M-15, A-03, Q-1, Q-7]
      tag: "Source: Variant 2 (base) Q-1, Q-7 + Variant 1 A-03 (narrowed); merged per Change #4 (C-003, variant 2, 70)"

