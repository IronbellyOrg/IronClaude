  quote: '- user scope, by name and by launcher shape: `jq -e ''(.mcpServers // {}) | (has("serena") or has("codebase-memory-mcp") or (to_entries | map(select(.key != "serena-local" and ((.value.args //
    []) | tostring | test("serena-agent|start-mcp-server")))) | length > 0)) | not'' ~/.claude.json`; a failure caused by an entry the retire step reported as kept (non-empty `env`/`headers`, or a Serena
