  section: 2.12 Retiring Serena once codegraph is ready (amends Phase 1
  quote: '- `codegraph_ready()` (in `install_mcp.py`): one read-only predicate on current state, shared by `install`, `install --list` and `doctor`. True when the user entry `codegraph` either equals the
    expected entry (§2.4) or is an owned entry whose command''s `--version` prints `1.6.2`, or is a user-managed entry whose command resolves to an executable (any version: the user chose it).'
  citation: source.md:194
- id: INF-021
  section: 2.12 Retiring Serena once codegraph is ready (amends Phase 1
  quote: '- When ready, the retire step also removes: (a) every user-scope entry other than `serena-local`, matched by shape rather than by key name, whose args contain `start-mcp-server` (this covers `serena`
    and a renamed Serena launcher), whose `type` is stdio or absent, and whose `env` and `headers` are each **absent or `{}`** (Coder''s bundle and `claude mcp add` write `"env":{}`, and the live entry
    on this workspace has it: third review finding 1); and (b) the kind-B `~/.local/bin/codebase-memory-mcp` registration (its binary and upstream companions stay; the upstream `uninstall -y` command is
    prin'
