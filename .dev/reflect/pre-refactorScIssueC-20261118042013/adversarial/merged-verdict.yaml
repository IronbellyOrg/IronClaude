findings:
  - id: M1
    severity: blocking
    class: scope-creep
    tag: grounded
    provenance: [v1, v2, v3, probe]
    claim: >-
      Task 3 relaxes the E-SUBMIT-NEEDS-FULL stop rule so a bare --submit would commit, push and open a PR.
      The spec asks only for the default level to become full. The design record says a --submit with no
      --pipeline must STOP. Following the plan text would act outside the declared scope (safety).
    evidence:
      - >-
        src/superclaude/commands/issue.md:57 - the current rule reads "--submit with a value, or without --pipeline full: STOP E-SUBMIT-NEEDS-FULL"
      - >-
        src/superclaude/skills/sc-issue-protocol/SKILL.md:154 - same rule in the error table
      - >-
        docs/user-guide/commands.md:371 - same rule in the user guide
      - >-
        docs/designs/sc-issue-claim-pipeline-flag.md:85 - design record: "--submit with a value, or with --pipeline worktree or --pipeline none or no --pipeline: STOP E-SUBMIT-NEEDS-FULL"
      - >-
        src/superclaude/skills/sc-issue-protocol/scripts/orca_worktree.py:1900-1901 - the script checks only the resolved level (args.level != "full"), so the Markdown rule is the only guard against a bare --submit
    plan_change: >-
      Keep the rule at issue.md:57, SKILL.md:154 and commands.md:371, and copy the design wording
      "or no `--pipeline`" into all three, because once the table says "Omitted means full" the old wording
      "without --pipeline full" reads as satisfied (probe INV-005). Task 5 asserts that phrase and that a
      bare --submit still stops. Task 7 changes accordingly.

  - id: M2
    severity: medium
    class: missed-site
    tag: grounded
    provenance: [v1, v2, v3]
    claim: >-
      The launched-agent message opens with the worktree-level sentence for every level ("It stops at the plan
      boundary and waits; run the printed implement command") and then adds the full-level sentence, so at the
      new default of full it reads as a contradiction and could prompt a second /sc:implement. V2 downgraded its
      blocking grade to medium after round 2 (ambiguous, not observed wrong; it already affects explicit full claims).
    evidence:
      - >-
        src/superclaude/skills/sc-issue-protocol/refs/claim.md:142 - the launched text opens with the worktree sentence, then 'For full: "It runs every step and stops after implementation."'
    plan_change: >-
      Task 4 restricts "It stops at the plan boundary and waits; run the printed implement command" to the
      worktree level and adds a test that the full branch does not carry it.

  - id: M3
    severity: medium
    class: missed-site
    tag: grounded
    provenance: [v2, v3]
    claim: >-
      Task 10 says "Stage only" the src/, tests/, docs/ and plugins/ side, which leaves out .dev/tasks/.
      The project rule says .dev/tasks/ is always staged.
    evidence:
      - >-
        CLAUDE.md:35-37 - "ABSOLUTE RULE: .dev/tasks/ Is Always Staged" (git add .dev/tasks)
    plan_change: >-
      Task 10 adds .dev/tasks/ to the staged paths and an acceptance check that .dev/tasks/ is staged.

  - id: M4
    severity: medium
    class: missed-site
    tag: grounded
    provenance: [v3]
    claim: >-
      The architecture reference still states the old default (worktree) and the old E-SUBMIT condition, and no task updates it.
    evidence:
      - >-
        docs/architecture/SUPERVISED-ORCHESTRATION-TECHNICAL-REFERENCE.md:1557 - "--pipeline: worktree; --submit: off"
      - >-
        docs/architecture/SUPERVISED-ORCHESTRATION-TECHNICAL-REFERENCE.md:1635 - "--submit with a value or without --pipeline full"
    plan_change: >-
