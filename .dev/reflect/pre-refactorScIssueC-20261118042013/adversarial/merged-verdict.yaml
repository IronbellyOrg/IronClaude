  - id: M5
    severity: medium
    class: interaction-effect
    tag: grounded
    provenance: [probe]
    claim: >-
      A person's bare /sc:issue --claim N on an issue a coordinator already owns starts a second agent in the
      reused worktree, now at full, because a coordinator-started worker writes only a pending nonce and only
      cmd_launch writes the launch entry that already_launched reads. Plan B requires plan approval before that.
    evidence:
      - >-
        src/superclaude/skills/sc-issue-protocol/scripts/orca_worktree.py:1515-1523 - cmd_pending writes one pending record only
      - >-
        src/superclaude/skills/sc-issue-protocol/scripts/orca_worktree.py:1619-1631 - record_launch writes the launch entry
      - >-
        src/superclaude/skills/sc-issue-protocol/scripts/orca_worktree.py:1703-1708 - already_launched reads only the launch entry
      - >-
        src/superclaude/skills/sc-issue-protocol/refs/claim.md:43 - re-claim by the same login is allowed
      - >-
        src/superclaude/skills/sc-issue-protocol/refs/claim.md:95 - Wave 7 reuses the issue worktree when a coordinator owns the issue
      - >-
        docs/designs/issue-watcher.md:43 - Plan B: two inputs approve the plan, read by the coordinator
    plan_change: >-
      Record as a known risk, or add one sentence in Task 3 or Task 4: do not bare-claim an issue a coordinator owns.

