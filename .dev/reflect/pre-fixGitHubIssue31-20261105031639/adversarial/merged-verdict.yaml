    provenance: "Variant 1 (base), merged per Change EN-1"
  - id: EN-2
    source_findings: ["V1 F4", "INV-011"]
    note: >-
      Drain the rest of a paste with python3 and raw bytes (bash 3.2 has no `read -t 0.2`, ccsession:1426);
      cap or refuse text above about 128 KiB.
    provenance: "Variant 1 (base), merged per Change EN-2 with INV-011"
  - id: EN-3
    source_findings: ["V1 F13"]
    note: >-
      Capture the --ask status with `rc=0; name=$(...) || rc=$?`; keep a `trap 'exit 130' INT` around the
      capture; tests accept exactly 130 and check ICANON afterwards.
    provenance: "Variant 1 (base), merged per Change EN-3"
  - id: EN-4
    source_findings: ["V1 F9"]
    note: >-
      Verify `--version`, `--help` and non-session subcommands (mcp, doctor, update, install) pass through
      untagged; V1 gave no evidence that Orca sends them.
