      The driver's "Blocked:" stop condition has no baseline. For Stop events the count is taken before
      the send. For the "Blocked:" line the plan says only "the screen shows a Blocked: line". An earlier
      block message is still visible on the screen when the next prompt goes out. In session B step 3 the
