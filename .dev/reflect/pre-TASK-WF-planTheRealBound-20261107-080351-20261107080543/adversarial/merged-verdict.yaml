  - "The position-bias dual pass (a second evaluation in reverse order) was not run; the V1-over-V3 margin of 0.016 is inside the tiebreaker band."
  - "Probe items INV-001 to INV-011 came from Round 2.5 and were not debated by the advocates."
  - "INV-005, INV-006 and INV-008 are inferred from Claude Code behavior this review did not observe."
