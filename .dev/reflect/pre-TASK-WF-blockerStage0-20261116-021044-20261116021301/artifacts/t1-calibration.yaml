calibrator_class: sonnet            # blind calibrator (confidence-calibrator agent, model sonnet); disjoint from reviewer classes {haiku, opus}
calibrator_diversity: full
calibrator_ran_in_parallel_with_reviewers: true   # parsed-sparse pre-filter forces Tier 2 regardless of C, so the order does not change the tier
calibrated_C: 0.68
dimensions:
  citation_grounding: 0.85
  coverage_completeness: 0.65
  deviation_classification_clarity: 0.60
  risk_surface_coverage: 0.65
  recommendation_actionability: 0.65
observation_confidence:
