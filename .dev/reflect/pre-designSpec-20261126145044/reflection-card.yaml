findings:
  - id: F-1
    severity: Medium
    claim: "Task 1's fourth acceptance bullet cannot fail for the reason it states. It runs `grep -n \"keyword\" .../questions.py` and says it finds no copy of the table's cue words, but it searches for the word 'keyword', not for the cue words it lists (slow, latency, stack trace, pytest)."
    evidence: ".dev/tasks/to-do/TASK-WF-designSpec-20261126-144507/TASK-WF-designSpec-20261126-144507.md:47"
    consequence: "A questions.py that copies the table's cues would pass this check, so the design rule that the question wording must not copy the table (source.md:20 context, design section 5 questions.py job at source.md:36) is unchecked."
  - id: F-2
    severity: Medium
    claim: "Task 6 says `BudgetExhausted` stops the run, but the client does not let that exception out of `ask`. It catches it and returns a result with status `refused` and error `budget_exhausted`."
    evidence: "plan line 119 (Task 6 body) versus .dev/research/346-review-loop-experiments/p15/jev/jevlib/client.py:114-117"
    consequence: "An implementer who writes `except BudgetExhausted` around `ask` gets dead code, and the spend stop never fires; the test that expects a systemic stop would fail or, worse, be written to pass against the wrong signal."
  - id: F-3
    severity: Medium
    claim: "The design lists `runs/<run-id>/run-record.md` as a per-run file, but no task creates it or says what it holds. Task 6 writes only `jev-rows.jsonl` and `journal.jsonl` for a run."
    evidence: "source.md:42 versus the plan (no occurrence of 'run-record' in the plan)"
    consequence: "The run's recorded settings (timeout, retry policy, rule-file hash, price used) have no home, and Gate 2 and the scorer's RUN_INVALID reasons depend on such settings being recorded."
  - id: F-4
    severity: Medium
    claim: "Task 5 requires Gate 2 to check 'a per-request spend bound that fits the cap' but does not say what is checked or how it is verified. The design says the price must be re-confirmed by the coordinator before Gate 2 (source.md:88), and nothing in Task 5 turns that into a checkable event or field."
    evidence: "plan line 103 (Task 5) versus source.md:72 and source.md:88"
    consequence: "Gate 2 can pass with a stale price; the cap guard would then rest on an unverified figure."
  - id: F-5
    severity: Note
    claim: "The pull-request wording rule in the design ('it must say `Refs #611` and list B to E as left') belongs to the story's pull-request step and is not a task. It is outside the plan's scope but not named as outside."
    evidence: "source.md:104"
    consequence: "None for the build; a reader of the plan may not know where that obligation lives."

risks:
  - "Shared module state: the runner changes two `jevlib.config` attributes in its own process; Task 6 says tests restore them, and the 31 importers of `JevClient` are untouched (grounding file)."
  - "Corpus, labels, table answers and the live run are explicitly left for a person or the coordinator (plan line 20), so a finished build does not deliver the experiment's result."
  - "Three rule-file fields (the two Noul band operators and the unresolved-failure count) are written UNSET and Gate 1 refuses UNSET, so the live run stays closed until they are set."

