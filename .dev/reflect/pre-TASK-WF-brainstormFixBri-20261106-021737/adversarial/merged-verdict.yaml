recommended_wording_fix:
  kind: "OWNER amendment of brief Part 4"
  order: |-
    The plan copies Part 4 byte for byte (F-1 verifier, brief:45), so the plan cannot take this
    text on its own. Order: the owner amends the brief, then the plan is regenerated or edited at
    the lines named in part_d. The rule of brief:225 (nested contract listed in `artifacts`
    unconditionally, a failed call's included) is kept.
  part_a_amended_live_check_sentence: |-
    A live-check extra for brainstorm's codebase-enrichment wave reads: "when the brief passes `--codebase`, or the contract's `domain` is `code`, `architecture` or `incident` and the brief does not pass `--no-codebase`, `enrichment_used` holds a `source: codebase` entry; every `nested/analyze-<n>/return-contract.yaml` that exists is listed in `artifacts`; a `nested/analyze-<n>/` directory is required, and must then hold its own `return-contract.yaml` with every `artifacts` entry under it existing, only when a `Skill` tool call (not a `Task` or `Agent` call whose prompt only names `/sc:analyze`) in the worker's session file or in one of its subagent files (7.2 step 5) invokes `sc:analyze` with `--report-dir <report directory>/nested/analyze-<n>/` and a number for `<n>` and returns no tool error, the `codebase` entry is not `skipped` (the per-source enrichment timeout records `skipped` and can stop `/sc:analyze` before it writes) and `/sc:analyze` did not refuse that directory, because neither `quality_tier` nor `source` records whether `/sc:analyze` ran; when the session file is not verifiable, this last clause is recorded `not verifiable`, never PASS" (P1 check lc10 is the origin of this rule).
  part_a_what_changed:
    - "INV-019: the trigger is an actual Skill call that invokes `sc:analyze`, not any Skill, Agent or Task call that passes the flag text. Task and Agent prompts that only mention the command no longer count. A Skill call that returns a tool error does not count either."
    - "C-001: the 'listed entries exist' check applies only to a required directory, so the timeout (`skipped`), refusal and tool-error cases are exempt by construction. A call with a usable directory that failed must still have written its contract (`analyze.md:98`), so its missing file is still a true FAIL."
    - "INV-011: the listing rule names the contract file, and the existence rule speaks of the directory and the `artifacts` entries under it."
    - "Pins kept: `lc10`, ``a `source: codebase` entry`` and ``neither `quality_tier` nor `source` records`` are still present (plan:143). Still one appended line in step 4 (plan:144). No test reads the spec."
    - "Not changed: 'the contract's `domain`' (M-12, P3); 'this last clause ... `not verifiable`' still names the required-directory clause, so residual risk 4 needs no edit. V3's Edit 2 is no longer needed."
  part_a_trigger_rationale: |-
    Wave 2A hands each source to a `Task` agent (`SKILL.md:183`), so a real `/sc:analyze` run
    appears as a Skill tool call in that subagent's file, which 7.2 step 5 already reads (spec:292:
    "each subagent's own file is under ... `subagents/`"). The spec's nested propagation rule names
    "the Skill tool or the Agent tool" (spec:62); an Agent-tool route still reaches `/sc:analyze`
    through a Skill call in the subagent file. lc10's record shows how Skill calls appear: by skill
    name (`sc:brainstorm-protocol`, `sc:adversarial-protocol`, `lc10-result.md:13`). A refusal is
    "printed in chat only" (`analyze.md:97`), so it can be judged only from the session file, which
    the required clause already reads.
  part_a_residual_risk_after_fix:
    - "A `/sc:analyze` run not made through a Skill call (for example a subagent that reads the command file and follows it), or recorded under a skill name other than `sc:analyze` (the command's own name is `analyze`, `analyze.md:2`; the `sc:` form is inferred from lc10's other Skill names), is not seen, and its missing folder passes. The 'every existing contract is listed' clause still catches an unlisted contract."
    - "How the session file records the Skill input (`skill`, `args`) and a tool error is INFERRED from Claude Code's session format (spec:302 says only '`tool_use` blocks with a `name`')."
    - "Listed entries under a directory that is not required are not checked for existence. This is the case Task 1's 'also when the call failed' produces, so it is intended."
    - "With the session file unverifiable the required clause is `not verifiable`, which blocks PASS until the owner accepts the gap (spec:300), unchanged."
  part_b_task_1_tail_decision: |-
    No change. The Task 1 skill tail "The nested contract is listed in `artifacts`, also when the
    call failed." (brief:229, plan:38) stays byte for byte, as does its AC (plan:45). Rewording it
    (V3 R3-1's original remedy) breaks brief:225 and was withdrawn in Round 2.
  part_c_residual_risk_block:
    brief_237_and_plan_133: "No change. With part A the claim 'no known false FAIL on a correct run' is true."
    brief_238_and_plan_134_risk_1: "No change."
    brief_239_risk_2: "See findings M-04 replacement_wording.brief_239_risk_2."
    plan_135: "See findings M-04 replacement_wording.plan_135."
    brief_240_and_plan_136_risk_3: "Append, before the closing period: , and, because `enrichment_used` holds one `codebase` entry, it exempts every `nested/analyze-<n>/` call of the run at once"
    brief_241_and_plan_137_risk_4: "No change."
    new_risk_5: "See findings M-04 replacement_wording.new_risk_5_brief_after_241; the same text, as a bullet, goes after plan:137."
  part_d_plan_lines_to_change:
    - {plan_line: "plan:128", change: "The part A sentence, byte for byte", findings: ["M-01", "M-02", "M-03"]}
    - {plan_line: "plan:133", change: "None (the claim becomes true)", findings: ["M-04"]}
    - {plan_line: "plan:135, plan:136, new bullet after plan:137", change: "Part C texts", findings: ["M-04"]}
    - {plan_line: "plan:143", change: "Add pin `invokes `sc:analyze`` (with brief:109)", findings: ["M-05"]}
    - {plan_line: "plan:131", change: "None (Necessary-deviation record still accurate)", findings: []}
    - {plan_line: "plan:144", change: "None (still two lines changed)", findings: []}
  if_owner_declines: |-
    plan:128 must stay as it is (F-1, brief:45). The plan then narrows plan:133 to "has two known
    false-FAIL paths" and adds two bullets naming them (INV-019's Task-prompt path; C-001's
    timeout or refusal path), recorded as a departure from brief:237 next to plan:131 (V2
    advocate R2 option (b)). INV-019 then stays open.

