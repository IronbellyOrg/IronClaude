findings:
  - id: F-1
    severity: Medium
    claim: "Gate 2's `spend_bound` check needs the text of every frozen prompt to estimate the whole-run tokens, but the plan also says `gate1` and `gate2` hash files only and never call the corpus loader. The plan does not say how the gate gets the prompts."
    evidence: "plan:106 (spend_bound) and plan:108 (gates never call the corpus loader); loader.load_corpus runs jevlib.manifest.privacy_violation, which reads os.environ at jevlib/manifest.py:35"
    consequence: "An implementer either calls `load_corpus` inside Gate 2, which reads the key variable before the gates have passed and breaks the no-environment-read claim of the runner test at plan:168, or invents an unscreened second parser of corpus.jsonl."
  - id: F-2
    severity: Medium
    claim: "The row format of `runs/<run-id>/jev-rows.jsonl` is defined only in Task 6, but Task 5 consumes it (`score(corpus, table_answers, jev_rows, ...)`, hand-built rows in its tests, `run_meta` from the rows), and Task 5 comes first and does not depend on Task 6."
    evidence: "plan:123 (Task 5 depends on Tasks 3 and 4), plan:125 and plan:129 and plan:138 (Task 5 uses rows), plan:155 (the only place the row fields are listed)"
    consequence: "The implementer of Task 5 has no stated row schema, so the hand-built rows in its tests can differ from what the runner writes, and the scorer is only shown to work on rows the runner never produces."
  - id: F-3
    severity: Medium
    claim: "Gate 2 refuses when any `run_end` event exists, and `execute` writes `run_end` also when the whole-run reservation is refused before any post. So a run that sent nothing blocks every later Gate 2."
    evidence: "plan:106 (prior_run), plan:152 (spend_bound ends the run before any post), plan:156 (run_end appended at the end, also after a stop)"
    consequence: "If the ledger or the price needs a fix after a zero-post refusal, the coordinator cannot retry in this folder, although the agreed rule forbids only a rerun of a whole run that was posted."
  - id: F-4
    severity: Note
    claim: "The Task 4 acceptance bullet says either gate refuses on a hash mismatch for the rule, the table answers or any `jevlib` or code file, but Gate 1 checks only the corpus-side hashes; the others are Gate 2 checks."
    evidence: "plan:102 (Gate 1 checks) and plan:106 (Gate 2 checks) against plan:112"
    consequence: "Wording only; a test written to the bullet would try to make Gate 1 fail on a code hash it never reads."
  - id: F-5
    severity: Note
    claim: "The `run` subcommand does not say what happens when `TYPESAFE_API_KEY` is unset after both gates pass: the exit code, and whether a `run_end` event is written."
    evidence: "plan:159"
    consequence: "Small gap; an unset key would end in an uncaught error or a `KeyMissing` at the first ask, with F-3's consequence if a `run_end` is written."

