- id: INF-025
  label: 2.3 Brief contents
  quote: 'For each Task the coordinator''s brief states: the exact command line, including `--unattended` where the command accepts it at this phase, and every flag section 3 lists as required, written
    as a `Command:` line in the layout below; the report directory, unique to this Task, so the contract path is known before dispatch (WC-4, WC-11); the blocked-gate policy line, `On a blocked gate: report
    blocked` or `On a blocked gate: ask the coordinator` (WC-3); whether the end-of-Task local commit is authorized, quoting the user''s instruction word for word (D4); at P0 only, the command''s report
    file and the outcome rule AC-0.4 gives for it (WC-5)'
  citation: .dev/tasks/to-do/TASK-WF-orcaWorkerContra-20261103-012232/source.md:84
