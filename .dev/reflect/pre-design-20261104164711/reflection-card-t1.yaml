  - id: R4
    severity: low
    claim: "Resume-planner state dicts in Task 4 could drift from the Task 7 fold (G6). Task 8 partly mitigates this because its N1 and B2 tests feed a real RunLog into conflict_resume_plan (SRC:1340)."
