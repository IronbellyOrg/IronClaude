- id: INF-001
  section: 0. Precondition and how the executor verifies it
  quote: '| G1 | CLI on PATH at the pinned version | `command -v codegraph && codegraph --version` and `PIN=$(uv run --no-sync python -c ''from superclaude.cli.install_codegraph import VERSION; print(VERSION)'')`
    | prints a path, and the printed version equals `$PIN` (Phase 2 pin constant `VERSION` in `src/superclaude/cli/install_codegraph.py`, `1.6.2` at the time of writing, `P2` F1). If `~/.codegraph/.superclaude-bin`
    exists and its content differs from `realpath "$(command -v codegraph)"`, record it: CLI calls then reach a different binary than the MCP server (standing rule 8) |'
  citation: source.md:23
- id: INF-002
  section: 0. Precondition and how the executor verifies it
  quote: '| G2 | MCP server registered at user scope | `claude mcp list 2>/dev/null \| rg -n ''^codegraph:''` | one line ending in `Connected` |'
  citation: source.md:24
- id: INF-003
  section: 0. Precondition and how the executor verifies it
  quote: '| G3 | The registered tool list equals Phase 2''s constant | `MT=$(uv run --no-sync python -c ''from superclaude.cli.install_codegraph import MCP_TOOLS; print(MCP_TOOLS)'')` then `jq -e --arg
    t "$MT" ''.mcpServers.codegraph.env.CODEGRAPH_MCP_TOOLS == $t'' ~/.claude.json` | exits 0, and `$MT` is either `node,search,callers,callees,impact,files,status` (seven-tool branch) or `status` (status-only
    branch). Record the branch in the decision log; both pass.'
  citation: source.md:25
- id: INF-004
  section: 0. Precondition and how the executor verifies it
  quote: '| G4 | This worktree is indexed | if `mcp__codegraph__codegraph_status` is in the session''s tool list, call it with `projectPath` = realpath of `git rev-parse --show-toplevel`; else, only when
    `pgrep -f ''codegraph\.js (init\|index)''` prints nothing, `codegraph status` | "Index is up to date" (or a pending-sync list). If `pgrep` prints a line, an init (usually Phase 2''s session-start hook)
    is running: wait 30 s and re-check, at most 20 times.'
  citation: source.md:26
- id: INF-005
  section: 0. Precondition and how the executor verifies it
  quote: '| G5 | Session sees the tools | in the executor''s own Claude session''s tool list | seven-tool branch: contains `mcp__codegraph__codegraph_callers` and `mcp__codegraph__codegraph_status`, not
    `mcp__codegraph__codegraph_explore`. Status-only branch: contains `mcp__codegraph__codegraph_status`, neither `_callers` nor `_explore` |'
  citation: source.md:27
- id: INF-006
  section: 0. Precondition and how the executor verifies it
  quote: '| G6 | Phase 1 landed and its slots ledger exists | `rg -n ''mcp__serena__'' src/superclaude plugins/superclaude commands agents` and `test -s .dev/codegraph-migration/handoffs/phase3-codegraph-slots.md`
    | the `rg` prints nothing (`P1 §4.3` acceptance 1) and the ledger file exists. Anything else is H4 |'
  citation: source.md:28
- id: INF-007
  section: 1.1 By job group
  quote: 1. **Read before cite or edit.** A codegraph answer locates code; it is not a citation.
  citation: source.md:70
- id: INF-008
  section: 1.1 By job group
  quote: 2. **Fail open to the Phase 1 floor.** codegraph missing, unlisted, index missing, foreign or stale → use the step's Phase 1 floor (Grep/Glob/Read, `P1 §4.1` G2) and record one `graph:*` token
    (section 4) in the skill's existing `degraded` / `degraded_components` list.
  citation: source.md:71
- id: INF-009
  section: 1.1 By job group
  quote: 3. **Empty is not absence.** Files over 1 MB, ignored files, dependency dirs and Markdown are not indexed (`EVAL §4`, §5.4), and callers are call edges only.
  citation: source.md:72
- id: INF-010
  section: 1.1 By job group
  quote: '4. **Agents get exact names and the run''s state.** A read-only agent lists exact `mcp__codegraph__codegraph_<tool>` names (never `mcp__codegraph__*`) and only for spawn modes that passed the
    T0 smoke matrix; its brief carries `index_state`, `checked_at`, `worktree_root` and the `projectPath` to pass on every call, and it calls codegraph only when `index_state: fresh` (access decision §4).'
  citation: source.md:73
- id: INF-011
  section: 1.1 By job group
  quote: 5. **No `explore`, no mutating CLI verb in a skill or agent.** No primitive names `codegraph_explore`, `codegraph explore` or `codegraph context`; no allowlist says `Bash(codegraph *)`.
  citation: source.md:74
- id: INF-012
  section: 1.1 By job group
  quote: 6. **Both tool-list branches.** Primitive text is the same whichever value Phase 2 shipped (section 0 G3).
  citation: source.md:75
- id: INF-013
  section: 1.1 By job group
  quote: '7. **Guard every CLI `status`.** Run CLI `codegraph status` only when `pgrep -f ''codegraph\.js (init|index)''` prints nothing; when it prints a line, skip `status`, set `index_state: stale` with
    token `graph:stale` (graph rows are leads only) and, in `/sc:graph`, `next_action: wait_for_sync`.'
  citation: source.md:76
- id: INF-014
  section: 1.1 By job group
  quote: 8. **CLI binary.** A primitive calls the CLI as bare `codegraph` (that is what its exact `Bash(codegraph <verb> …)` allowlist entries match).
  citation: source.md:77
- id: INF-015
  section: 1.1 By job group
  quote: 9. **Tier above the floor.** Where Phase 1 left a floor (ledger action `floor`), the codegraph step is inserted before it and the floor text stays unchanged below it; a row never says "skip" where
    the floor exists (`P1 §4` decision, G6).
  citation: source.md:78
