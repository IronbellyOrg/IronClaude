        lines: "493-501"
        role: source
    provenance: "card 2 F2 narrowed; adopted over base card 1's conceded H3 non-finding"
  - id: M4
    topic: "D: AC2 asserts otherwise unchanged with no verifier"
    source_reviewers: [reviewer-2]
    claim: "T1.AC2 (plan:43) asserts the template is \"otherwise unchanged apart from the analysis-name wording\" but names no verifier, while plan:31 supplies the pre-fix copy (`artifacts/pre/template-summary.md`) a diff could run against."
    severity: MINOR
