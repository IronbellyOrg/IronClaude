non_findings:
  - topic: "E: coverage/traceability (guide-row no-edit; design-doc old-path exclusion)"
    rationale: "No finding. The design-doc old-path exclusion is encoded, not missing: plan:87 mandates the dated note naming the old summary.md, plan:94's AC carries the explicit \"plus the old name inside the dated note\" exception clause, and plan:71 enumerates the deterministic test's scope exactly (worker texts, templates, whole issue.md; the design doc is excluded by enumeration, not omission). The guide-row no-edit is an evidenced non-edit: plan:91 records the check and plan:96 is the t4-guides.log AC. At most one INFO-class observation remains -- design-doc cleanliness attested by one-off log rather than permanent test, consistent with the plan's stated exception."
    raised_by: reviewer-2
    withdrawn_by: reviewer-2
    disposition: "withdrawn by its own advocate in Round 2 (C-005, 90% confidence); recorded as non-finding"
  - topic: "F: paragraph drift guard"
    rationale: "No finding. plan:67 (\"update _TOOL_INPUT_PARAGRAPH to the exact Constraints paragraph\") plus plan:75's whole-file test run mechanically execute tool_input_rule_problems (tests:271-291, engaged via tests:298-301) -- exactly-once (tests:281-282) and under-heading (tests:283-284) -- leaving no residual executor failure mode. Card 3's F2 correctly identified the guard but mis-classified the plan's silence about it as a defect."
    raised_by: reviewer-3
    withdrawn_by: reviewer-3
    disposition: "reclassified by its own advocate in Round 2 after re-walking the executor path (C-006, 95% confidence); recorded as documentation note"
