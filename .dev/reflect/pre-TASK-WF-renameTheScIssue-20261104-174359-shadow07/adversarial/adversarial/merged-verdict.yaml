findings:
  - id: M1
    topic: "A: stale local .claude/ mirror after the rename"
    source_reviewers: [reviewer-1, reviewer-3]
    claim: "The rename leaves the local `.claude/` mirror stale with no task to clear it: plan:20 forbids `.claude/` edits and is the plan's only sync mention, and no task runs sync-dev/verify-sync. Because sync-dev is cp-only (Makefile:108-163), the stale mirror `templates/summary.md` persists even after sync-dev — only manual removal clears it — while a local verify-sync detects it via `diff -rq` \"Only in\" (Makefile:178); CI regenerates before verifying (test.yml:125-131), so CI is unaffected, and both task test runs read `src/`, so no AC detects it (anything reading `.claude/` during development would see the old names)."
    severity: MINOR
    blocking: false
    citations:
      - path: ".dev/tasks/done/TASK-WF-renameTheScIssue-20261104-174359/TASK-WF-renameTheScIssue-20261104-174359.md"
        lines: "20"
        role: plan
      - path: "Makefile"
        lines: "108-163"
        role: source
      - path: "Makefile"
        lines: "178"
        role: source
      - path: ".github/workflows/test.yml"
        lines: "125-131"
        role: source
      - path: ".pre-commit-config.yaml"
        lines: "115-126"
        role: source
    provenance: "card 1 F1 (base) + card 3 F1 framing and citations; remedy corrected per invariant probe"
  - id: M2
    topic: "B: grep substring ambiguity across the three ACs"
    source_reviewers: [reviewer-1, reviewer-2]
    claim: "The three grep ACs (plan:44, plan:56, plan:94) share the substring ambiguity: `summary\\.md` matches inside every `issue-summary.md` line, so \"prints only `issue-summary.md` occurrences\" is satisfiable only under the natural reading (every matched line is an `issue-summary.md` occurrence) or via an unstated `grep -v`/anchored regex. The concrete failure mode is a line holding both names passing a loose reading. The verbatim-twin sites are T1 (plan:44) and T2 (plan:56); T4 (plan:94) is the best-specified of the three because its dated-note exception is explicit and anchored; the backstop is `test_old_summary_path_is_gone`."
    severity: MINOR
    blocking: false
    citations:
      - path: ".dev/tasks/done/TASK-WF-renameTheScIssue-20261104-174359/TASK-WF-renameTheScIssue-20261104-174359.md"
        lines: "44"
        role: plan
      - path: ".dev/tasks/done/TASK-WF-renameTheScIssue-20261104-174359/TASK-WF-renameTheScIssue-20261104-174359.md"
        lines: "56"
        role: plan
      - path: ".dev/tasks/done/TASK-WF-renameTheScIssue-20261104-174359/TASK-WF-renameTheScIssue-20261104-174359.md"
        lines: "94"
        role: plan
      - path: "tests/skills/test_issue_worker_agents.py"
        lines: "482-490"
        role: source
    provenance: "card 1 F2 (base framing) + card 2 F1 propagation; card 2 Round-2 converged wording; scope narrowed per invariant probe"
  - id: M3
    topic: "C: T3 red-check is an unasserted log"
    source_reviewers: [reviewer-2]
    claim: "plan:76 states the substantive expectation (reports `summary.md` as a blocked name, `<D>/summary.md` as an old path) but says \"exit code recorded\" with no expected value, so the red-check is an unasserted log rather than a check. The pinned `test_checks_flag_pre_fix_text` (tests:493-501) pins the same facts on in-module literals while the red-check runs on the real `artifacts/pre/` captures — different evidence objects, so narrowed from \"duplicates\"."
    severity: MINOR
    blocking: false
    citations:
      - path: ".dev/tasks/done/TASK-WF-renameTheScIssue-20261104-174359/TASK-WF-renameTheScIssue-20261104-174359.md"
        lines: "76"
