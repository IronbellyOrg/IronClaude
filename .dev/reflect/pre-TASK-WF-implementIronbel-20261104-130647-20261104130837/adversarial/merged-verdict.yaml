documented_ceilings:
  - form: "bash -c / sh -c string argument"
    example: "bash -c 'python3 x.py'"
    note: "plan L58 allows bash -c; stated as a ceiling so L40 and L58 agree"
    source: [R1-F5, R2-F6, R3-F6]
  - form: "eval"
    example: "eval \"python3 x.py\""
    source: [R1-F5]
  - form: "xargs"
    example: "echo x.py | xargs python3"
    source: [R1-F5, R2-F6, R3-F6]
  - form: "find -exec"
    example: "find . -name '*.py' -exec python3 {} \\;"
    source: [R1-F5, R2-F6, R3-F6]
  - form: "option-taking wrappers"
    example: "sudo -u bob python3, nice -n 10 python3, env -u X python3, exec -a name python3"
    note: "ceiling unless the scanner skips wrapper options (M-CEILINGS)"
    source: [R1-F4, R3-F6]
  - form: "path-form and special wrappers"
    example: "/usr/bin/env python3, coproc python3, command -p python3, time -p python3"
    source: [INV-014]
  - form: "leading redirections before the command word"
    example: "< in.json python3 E7, >out.txt python3 E8"
    source: [INV-011]
  - form: "heredoc piped or fed to a shell"
    example: "cat <<'EOF' | bash / python3 E14 / EOF; also sudo bash, /bin/bash, partly quoted delimiters"
    source: [INV-012]
  - form: "Monitor tool shell command"
    example: "Monitor takes a shell command outside the Bash matcher"
    source: [INV-022]
  - form: "jq missing on the host"
    example: "the hook fails open (exit 0) for every command"
    note: "plan L21; made visible by R1-F6 / AMD-07"
    source: [INV-017, R2-F3]
  - form: "claude --bare sessions"
    example: "--bare skips settings hooks, so the hook never runs"
    source: [INV-016]
