      - 'Round 2 evidence 2: the FP already exists, so document-and-pin of R3-F5 is insufficient; one stateful scanner (round2-variant-3.md:25)'
      - 'Round 2 evidence 3: jq regex cannot track a context stack; plan L41 offers both; require awk (round2-variant-3.md:26)'
      - 'INV-002: awk -v processes escapes (printf "a\\nb" becomes printf "a\nb", mawk 1.3.4); ENVIRON/stdin keep bytes (invariant-probe.md:10)'
      - 'INV-004 (HIGH): unquoted-delimiter heredoc has literal quotes but $( and backticks expand: cat <<EOF / don''t / EOF / python3 E3 runs; cat <<EOF / v=$(python3 E4) / EOF runs (invariant-probe.md:12)'
      - 'INV-005: continuation and comment strip cannot be pre-passes (invariant-probe.md:13)'
      - 'INV-006: <<-''EOF'' strips leading tabs; tab+EOF terminates; python3 E5 after it runs (invariant-probe.md:14)'
      - 'INV-007: <<< here-string has no body (cat <<< ''{}'' / python3 E6 runs); $((1<<4)) is not a heredoc (invariant-probe.md:15)'
      - 'INV-008: FP ls -d $(pwd)/bin/python3 only prints a path; FN PYTHONPATH=$(pwd)/src python3 E13 runs; resume the outer word (invariant-probe.md:16)'
      - 'INV-009: $((1+2)) and case patterns a); echo "$(echo $((1+2)) )"; python3 E15 runs (invariant-probe.md:17)'
      - 'INV-010: "python3" E9, ''python3'' E9b, \python3 E9c, "$PWD/bin/python3" E10 all run (invariant-probe.md:18)'
      - 'INV-013: $''don\''t'' then python3 E11 runs (invariant-probe.md:21)'
      - 'INV-027 (HIGH): the consensus scanner is falsified by INV-003, 004, 006, 007, 008, 010, INV-008 E12 and INV-016/017 (invariant-probe.md:35)'
      - 'debate-transcript.md:41 (C-003, V3, 90%), :42 (C-004, V3, 85%), :44 (C-006, V3, 95%), :62 (A-003, awk stateful scanner)'
    fix: >-
      Implement the Task 1 tokenizer as one stateful awk scanner (not a jq regex), run with
      LC_ALL=C (M-AWK-LOCALE), reading the command on stdin, never through awk -v or an environment
      variable (INV-002, INV-003). Rules:
      (a) quote states: single, double, and ANSI-C $'...' with backslash escapes (INV-013);
      (b) an unquoted # at word start begins a comment to end of line, with no quote tracking and no
      continuation inside it (R3-F3, INV-005);
      (c) backslash-newline joins only in states where bash joins (INV-005, R1-F4);
      (d) $( and backticks, including inside double quotes, push a nested context with fresh quote
      state; ) pops it and resumes the outer word instead of starting a new simple command (INV-008);
      $(( )) arithmetic and case-pattern ) do not push or pop a command context (INV-009);
      (e) <<WORD and <<-WORD start heredocs; <<< and $((1<<4)) do not (INV-007); the body ends at a
      line equal to the delimiter after stripping leading tabs for <<- (INV-006); a quoted-delimiter
      body is literal unless the heredoc's command word is a shell (R3-F2); an unquoted-delimiter
      body has literal quotes but its $( and backticks are scanned (INV-004);
      (f) dequote the command word and drop a leading backslash before the basename check (INV-010).
      Task 2 tests: blocked E1, E3, E4, E5, E6, E9, E9b, E9c, E10, E11, E13, E15, a # don't comment
      followed by a python3 line, and a quoted-delimiter heredoc whose body has an apostrophe
      followed by a real python3 line after EOF; allowed E12 (ls -d $(pwd)/bin/python3) and the
