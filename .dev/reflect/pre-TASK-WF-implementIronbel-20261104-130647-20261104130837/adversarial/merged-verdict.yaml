      when this finding, R1-F5, R1-F6 (INV-017), R1-F11 (INV-003) and M-TASK7 (INV-016) all land.
      The false-positive half of R3-F3 (a comment such as '# check (python3 version)' blocked) is
      minor on its own and is fixed by rule (b).
    sources: [V3 R3-F2 (desync half), V3 R3-F3 (desync half), V3 Round 2 evidence 1-3, INV-002, INV-004, INV-005, INV-006, INV-007, INV-008, INV-009, INV-010, INV-013, INV-027, C-003, C-004, C-006, X-003, A-003]
