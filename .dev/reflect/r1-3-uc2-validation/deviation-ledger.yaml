deviations:
  - id: DEV-R13-001
    title: "Dynamically-run certify step bypasses execute_pipeline → CERTIFY_GATE never evaluated"
    severity: HIGH
    deviation_class: drift
    regression_risk: true
    evidence:
      - "src/superclaude/cli/roadmap/executor.py:2170 — _run_certify_after_remediate runs certify via `roadmap_run_step(certify_step, config, lambda: False)`, a BARE call outside execute_pipeline."
      - "src/superclaude/cli/pipeline/executor.py:267,329 — gate_passed() is called ONLY inside execute_pipeline's step loop."
      - "src/superclaude/cli/roadmap/executor.py:1021-1965 — _roadmap_run_step_impl contains ZERO gate_passed calls (grep-verified); L1083-1084 comment: 'Returns PASS unconditionally; gate evaluation is handled separately'."
      - "Therefore CERTIFY_GATE's 3 semantic_checks (certified_is_true, per_finding_table_present, frontmatter_values_non_empty) AND the new code_assertion are NEVER evaluated on the produced certification-report.md."
    compounding:
      - "src/superclaude/cli/roadmap/executor.py:3369 vs :3409 — _save_state runs BEFORE the certify append, so certify_result is NOT persisted to .roadmap-state.json."
      - "src/superclaude/cli/roadmap/executor.py:3399 vs :3409 — the failures sys.exit runs BEFORE certify, so a certify FAIL is non-halting (executor.py:2175-2178 only prints)."
    spec_relation: >
      §MVR §2 says 'Wire build_certify_step() as the final step.' The step now runs, but it is
      wired OUTSIDE the gated executor, so the gate that gives the step meaning is never evaluated.
      Does not contradict a literal acceptance criterion (→ not a hard Regression), but defeats
      CERTIFY_GATE's purpose and renders the headline R1.3 CodeAssertion runtime-inert in production.
    why_pg81_missed_it: >
      PG8.1 verified (correctly) that build_certify_step has a production caller and that the CI
      test enforces dispatch-reachability. It did NOT verify that the production execution path
      evaluates the gate. The sonnet heterogeneous reviewer surfaced it; haiku and the T1 pass did not.
    remediation: >
      OPTION B (recommended, small blast radius): inside _run_certify_after_remediate, after
      roadmap_run_step returns, explicitly call gate_passed(certify_step.output_file, CERTIFY_GATE,
      envelope=<envelope>, repo_root=<repo_root>) and act on the verdict (set status, persist to
      state, optionally halt). This closes DEV-R13-001 AND DEV-R13-002 in one local change.
      OPTION A: route certify through execute_pipeline so it is gated like every other step.

  - id: DEV-R13-002
    title: "code_assertion runtime-dormant via gate_passed envelope-None fail-open shim"
    severity: MEDIUM
    deviation_class: necessary
    regression_risk: false
    evidence:
      - "src/superclaude/cli/pipeline/gates.py:93-98 — when criteria.code_assertions is set but envelope is None or repo_root is None, returns (True, None) — a fail-OPEN skip."
      - "All production gate_passed call sites omit envelope/repo_root: pipeline/executor.py:267,329; sprint/executor.py:842; cli_portify/executor.py:417; cleanup_audit/executor.py:137."
    spec_relation: >
      §MVR §2 'CodeAssertion guarantees no future step ships unwired' — the guarantee IS provided
      via the CI test (test_dispatch_reachability). Runtime enforcement is deferred to R1.6.
    tension: >
      The shim is a NEW fail-OPEN default. The task's own Contract #5 / R1.6 explicitly targets
      fail-open defaults for DELETION. Introducing a new (documented, temporary) fail-open path is
      in tension with the task's anti-fail-open thrust. Documented in Follow-Up Items (High) + PG8.1.
    remediation: "Tracked R1.6 carry-forward (delete shim + plumb envelope into live gate path). Option-B fix for DEV-R13-001 would also resolve this for certify specifically."

