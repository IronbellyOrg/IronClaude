    release_marker_count: 0
    last_marker_release: ""
    cutover_eligible: false
    cutover_at_count: 3
  score:
    tool_write_flag_default: false
    release_marker_count: 0
    last_marker_release: ""
    cutover_eligible: false
    cutover_at_count: 3
  merge:
    tool_write_flag_default: false
    release_marker_count: 0
    last_marker_release: ""
    cutover_eligible: false
    cutover_at_count: 3
  spec_fidelity:
    tool_write_flag_default: false
    release_marker_count: 0
    last_marker_release: ""
    cutover_eligible: false
