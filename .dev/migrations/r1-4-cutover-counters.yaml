    last_marker_release: ""
    cutover_eligible: false
    cutover_at_count: 3
  certify:
    tool_write_flag_default: false
    release_marker_count: 0
    last_marker_release: ""
    cutover_eligible: false
    cutover_at_count: 3
  validate_reflect:
    tool_write_flag_default: false
    release_marker_count: 0
    last_marker_release: ""
