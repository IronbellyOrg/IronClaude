# cap-edits.yaml: literal, mechanically checkable edit table for review-loop caps and at-cap rules.
#
# Date: 2026-11-02. Branch: fix/review-severity-rule (src unchanged from f90877be; line numbers verified on disk today).
# Inputs: .dev/review-severity-rule/cap-sites.md (every IN row), inventory.md sections 3.1 and 4 (item 3a: cli-portify
# default = 1 iteration = 2 review passes, 4a and 4c; corrected after PR #343 review),.dev/reflect/pre-removeTheAnyIssu-20261102042426/REPORT.md P2-B1..P2-B7.
# Rule: a review loop runs at most 2 fix cycles (3 reviews), then escalates to the user with the open blocking findings.
# Canonical at-cap clause: "After 2 fix cycles (3 reviews), HALT and escalate to the user with the open blocking findings".
# Open-Questions-and-proceed at-cap rules become "HALT and escalate to the user with the open blocking findings; minor
# findings stay as notes."
#
# Row contract (check each row mechanically):
#   - `old` is a literal substring of `file`; `grep -n -F -- "<old>" <file>` hits only the listed line(s) and the number of
#     matches equals `occurrences` (verified 2026-11-02 with grep -n -o -F, every hit attributed to a listed site).
#   - `old` holds only the cap / at-cap fragment; severity wording on the same line (e.g. "ALL findings regardless of
#     severity must be resolved.") is deliberately left out so the severity task can edit it independently.
#   - `new` never contains `old`. After applying: count(old) == 0 and count(new) >= 1 in `file`.
#   - Rows whose `occurrences` > 1 list every site in `lines`; apply them with replace-all.
#   - Multi-line `old` (one test row) uses YAML "\n" escapes; its uniqueness is anchored by a unique line inside it.
# Groups: agents | templates | skills-a (operational-guide, readme, roadmap, tech-reference, tech-research, prd/tdd
# build-request templates) | skills-b (task, task-builder) | portify (cli_portify code, sc-cli-portify-protocol,
# tests/cli_portify/test_convergence.py) | prd-core (cli/prd/models.py, rules/core/ib_agent_core.md).
