  # ---------------- HIGH ----------------
  - id: QA-001
    class: Regression
    severity: HIGH
    needs_owner_ruling: false
    citation:
      - ".dev/tasks/to-do/TASK-WF-spec-20261108-181640/TASK-WF-spec-20261108-181640.md:49"
    evidence: ["source.md:24-29", "source.md:149", "plan:52", "source.md:275"]
    finding: >-
      Task 2 unconditionally defers findings without a hunk or prior id, including critical findings,
      without distinguishing review 1. Review 1 has neither a computed surface nor prior ids, so this
      instruction permits all initial blockers to become non-blocking and produce a false PASS. The
      acceptance criteria repeat the unconditional rule rather than testing the initial-review exception.
      source.md:154 is a test-case list, not the rule; the rule at source.md:29, :40, :149 limits deferral
      to review 2 on.
    fix: >-
      Apply surface-based deferral only from review 2 and require an end-to-end review-1 test where a valid
      critical finding without a hunk or prior id yields blocking=1, verdict FAIL, and a reviser brief.
      See INV-027 for the review-1 grammar this fix also needs.
    related: [INV-027]
    source: "Variant 2 QA-001 (base; class Drift -> Regression, source.md:275 added); merged per Change #1"

  - id: INV-010
    class: Drift
    severity: HIGH
    needs_owner_ruling: true
    provisional_class: >-
      Regression if the owner rules that review-2 deferrals, demotions and withdrawals count at review 3
      (then plan:49 contradicts the plan:26 owner decision); withdrawn if the owner confirms review-3-only
      counting (then plan:49 matches source.md:204).
    citation: ["plan:26", "plan:49", "plan:53", "source.md:12", "source.md:29", "source.md:204", "source.md:220", "source.md:253", "source.md:280"]
    finding: >-
      `proxy_all` counts only findings first raised in review 3 and priors marked in review 3. A blocker
      declined in cycle 1 and withdrawn at review 2, a CRITICAL deferred at review 2, or a MAJOR demoted at
      review 2 leaves `R3-proxy-all`, which is the route the spec says the proxy closes ('the proxy sees
      both', source.md:253).
    fix: >-
      Get an owner ruling on whether review-2 deferrals, demotions and withdrawals count at review 3; if
      they do, make the count cumulative across reviews and add a test where a review-2 withdrawal is
      counted at review 3. Execution of Tasks 2, 4 and 12 waits on that ruling.
    source: "invariant-probe.md INV-010 (Round 2.5, HIGH UNADDRESSED, blocking); raised by the Round 2.5 probe, not calibrator-verified; merged per Change #20"

  - id: INV-001
    class: Drift
    severity: HIGH
    needs_owner_ruling: false
    citation: ["plan:71", "plan:74", "source.md:18", "source.md:26", "source.md:82", "source.md:95", "source.md:143", "source.md:229"]
    finding: >-
      `begin` for review N+1 replays the recorded check (plan:71; source.md:143 're-run check on the
      recorded report'), but the command appends `verdict_line` and adds the Reviser brief to the report
      after `check`, and the `<dir>` file list keeps no copy. A replay that re-reads the report path
      mismatches and exits 6 on every normal loop at review 2; exit 6 voids the replicate (source.md:229).
      plan:74 tests exit 6 only for a hand-edited ledger.
    fix: >-
      Store the accepted report bytes (in the ledger or `<dir>`) and replay those; add a subprocess test
      that appends the verdict line and a Reviser brief to the report before `begin --expect-round 2` and
      asserts exit 0.
    source: "invariant-probe.md INV-001 (Round 2.5, HIGH UNADDRESSED, blocking); raised by the Round 2.5 probe, not calibrator-verified; merged per Change #19"

  # ---------------- MEDIUM ----------------
  - id: INV-007
    class: Drift
    severity: MEDIUM
    needs_owner_ruling: false
    citation: ["plan:37", "plan:42", "source.md:144", "source.md:254", "source.md:264"]
    finding: >-
      The plan assumes the exclusive-create lock file is always released. plan:37 and :42 define the lock,
      temp file and symlink refusal with no stale-lock handling, so a worker killed mid-write (session
      timeout, stall) leaves the lock and every later call fails, which the experiment counts as a stall
      that costs a replicate (source.md:254, :264).
    fix: >-
      Fix direction: define a stale-lock rule (for example, the lock file records the holder's pid and a
      lock whose pid is not running is removed and reported in the JSON message), make `status` name a held
      lock and the recovery command, and test it.
    related: [M-02]
    source: "invariant-probe.md INV-007 (Round 2.5, MEDIUM UNADDRESSED); not calibrator-verified; merged per Change #24"

