  - id: F1
    class: Drift
    subtype: coverage gap
    severity: MEDIUM
    needs_owner_ruling: false
    title: Severity-rule green check cannot see untracked new files, so the acceptance criteria pass vacuously
    citation: ["plan:89", "plan:104", "plan:149", "plan:25", "tests/skills/test_review_severity_rule.py:28-51"]
    finding: >-
      _tracked_text() builds its file set from git ls-files; new spec-panel-diffgate.md and sc-diffgate/**
      are untracked until staged, so the severity-rule tests that read through `_tracked_text`, test_a
      (line 172), test_f (320), test_i (448) and test_k (506), never read them, and the Tasks 5, 6 and 10
      acceptance criteria pass vacuously. PR CI (.github/workflows/test.yml:3-7, :47) runs the full suite
      once the files are committed, so the defect is a false green inside the plan's own runs, not a
      shipped wrong result.
    fix: >-
      Before the severity-rule test in Tasks 5, 6 and 10, run `git add -N` on the new `src/` files (never
      `.claude/`); `tests/` is not in `_SCAN_TREES` (line 28), so marking it is unnecessary. Put the step in
      each AC.
    source: "Variant 1 F1 (class Regression -> Drift, subtype coverage gap; severity MEDIUM per Round 2 / A-005); merged per Change #6"

