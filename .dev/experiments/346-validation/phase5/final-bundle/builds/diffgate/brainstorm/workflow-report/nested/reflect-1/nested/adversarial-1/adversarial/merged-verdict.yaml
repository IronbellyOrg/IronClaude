  - id: INV-002
    class: Drift
    severity: MEDIUM
    needs_owner_ruling: false
    citation: ["plan:71", "plan:74", "source.md:262"]
    finding: >-
      Replay is assumed to reproduce a degraded check. After one repair turn, finding-level violations
      become `deferred: unanchored` and a missing PRIOR counts as `open`; a replay that re-runs `check`
      without the attempt number would reject (exit 1) instead of degrading, and report a mismatch
      (exit 6). plan:71 puts the degrade rule and replay in one task with no stated replay of attempt
      state; plan:74 tests degrade and replay separately, never degrade then `begin`; source.md:262
      expects degraded reviews to occur.
    fix: >-
      Fix direction: record the attempt number and `degraded` state with the accepted check and replay with
      them, so a degraded acceptance replays as degraded; add a test that degrades a review, then runs
      `begin --expect-round 2` and asserts exit 0.
    related: [INV-001]
    source: "invariant-probe.md INV-002 (Round 2.5, MEDIUM UNADDRESSED); depends on the INV-001 stored-copy design; not calibrator-verified; merged per Change #21"

