# AIDev02 default, seeded copy-if-absent to ~/.codex/config.toml (startup §6)
# and never overwritten. Codex takes its API base from config, not env, so
# this routes it through the LiteLLM gateway's OpenAI-compatible /cli/v1
# (Responses API). base_url must equal local.litellm_base_url + "/v1" (llm-env.tf, test-60).
model_provider = "litellm"
model          = "gpt-6-sol"

[model_providers.litellm]
name     = "LiteLLM"
base_url = "http://192.168.133.101:4000/cli/v1"
env_key  = "OPENAI_API_KEY"
wire_api = "responses"
# >>> codebase-memory-mcp MCP >>>
[mcp_servers.codebase-memory-mcp]
command = "/home/coder/.local/bin/codebase-memory-mcp"
args = []
env_vars = ["CBM_CACHE_DIR", "CBM_RUNTIME_DIR"]
# <<< codebase-memory-mcp MCP <<<
# >>> codebase-memory-mcp SessionStart >>>
[[hooks.SessionStart]]
matcher = "startup|resume|clear|compact"

[[hooks.SessionStart.hooks]]
type = "command"
command = "'/home/coder/.local/bin/codebase-memory-mcp' hook-augment"
command_windows = "& '/home/coder/.local/bin/codebase-memory-mcp' hook-augment"
timeout = 5

[[hooks.SubagentStart]]
matcher = "*"

[[hooks.SubagentStart.hooks]]
type = "command"
command = "'/home/coder/.local/bin/codebase-memory-mcp' hook-augment"
command_windows = "& '/home/coder/.local/bin/codebase-memory-mcp' hook-augment"
timeout = 5
# <<< codebase-memory-mcp SessionStart <<<
