  - id: D5
    hunk_ref: "src/superclaude/cli/prd/gates.py pairing-guard lookahead `(?!\\s*(?:/|(?i:or))\\s*(?:PASS|FAIL))` (≈:74)"
    class: drift
    severity: medium
    title: "Pairing guard over-rejects real verdicts (newline-spanning \\s* + missing value word-boundary)"
    rationale: >
      The grounding-gap #1 remediation (Authorized expansion, operator-directed [2026-06-13 13:07])
      added a negative lookahead to reject `PASS/FAIL`/`PASS or FAIL` template placeholders. Its
      implementation (a) uses `\s*` which spans newlines, and (b) omits a trailing word-boundary on
      the inner `(?:PASS|FAIL)`. Result: genuine single verdicts whose trailing prose begins with
      `or`/`/` + a PASS|FAIL-prefixed token are wrongly REJECTED — a false negative in the exact bug
      class PR #167 fixes. Latent: no test covers these shapes; contradicts the stated intent of the
      operator's own `test_check_verdict_field_accepts_value_with_trailing_prose`. Drift (not
      Regression) because no written acceptance criterion or previously-passing test is contradicted;
      MEDIUM because trigger inputs are realistic and the failure mode is the targeted bug class.
    gold_standard_ref: "PR #167 troubleshoot REPORT.md (false-negative elimination intent); guard's own trailing-prose accept test"
    evidence: >
      R3 live re-execution (_r3_verify.py): `Verdict: PASS or FAILURE expected` -> reject;
      `PASS or PASSED later` -> reject; `PASS or FAILS fast` -> reject; `PASS or FAILover cluster` -> reject;
      `Verdict: PASS\nor FAIL ...` -> reject. Reviewer-1 independently escalated and confirmed.
    is_real: true
    remediation: >
      One-line fix (verified): lookahead -> `(?![ \t]*(?:/|(?i:or))[ \t]*(?:PASS|FAIL)(?![A-Za-z]))`.
      Flips the 5 false-negatives to accept; all 7 template placeholders stay rejected; all core
      controls unchanged. Add 2-3 regression tests. Residual rare edge `PASS or FAIL-safe` still rejects.

