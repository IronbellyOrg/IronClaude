        Verdict: __PASS__ / __FAIL__        accept=True
        Verdict: **PASS** / **FAIL**        accept=True
        Verdict: PASS / __FAIL__            accept=True
        Verdict: __PASS__ or __FAIL__       accept=True
        Verdict: `PASS` / `FAIL`            accept=True
        Verdict: PASS (or FAIL)             accept=True
        Verdict: PASS [or FAIL]             accept=True
        Verdict: PASS | FAIL                accept=True
        Verdict: PASS <!-- or FAIL -->      accept=True
    rationale: |
      Incomplete delivery of the authorized D4 expansion. Does NOT regress the CORE PR#167 objective
      (numbered-list/underscore acceptance is correct), but it is the exact false-positive class the
      pairing guard was added to close — a real QA/PRD template emitting a decorated/piped placeholder
      would be mis-accepted as a passing gate. Drift/MEDIUM (silent gap vs documented intent), not a
      Regression against a literal tasklist criterion (tasklist never required a pairing guard).

