  - id: D2
    hunk_ref: "src/superclaude/cli/prd/gates.py:64 (regex value-side `[^\\w\\n:_]*[_*]*(PASS|FAIL)[_*]*`)"
    class: drift
    severity: medium
    title: "Quadratic-backtracking (ReDoS) robustness regression newly introduced by the underscore-support change"
    rationale: >
      The working-tree change introduced adjacent overlapping star quantifiers
      ([^\w\n:_]* and [_*]* both match '*'). On a long run of '*'/decoration chars
      before a near-miss value, the engine backtracks quadratically. Baseline (@2c5357c8)
      and committed HEAD (65bac7ed) stay <1ms at 40k chars; working tree = 5599ms.
      Does NOT violate any STATED acceptance criterion (no perf criterion exists), no
      inline rationale -> Drift. In engineering terms it is a complexity regression vs
      the prior linear forms. Practical exploitability is LOW (requires pathological
      ~tens-of-thousands-char input unlikely from real gate content) -> severity MEDIUM,
      not HIGH (down-adjudicated from Reviewer-1's HIGH).
    gold_standard_ref: "prior linear regex forms @2c5357c8 and @65bac7ed"
    evidence: >
      Timing harness: N=8k FINAL=224.91ms (ORIG 0.08 / INTERMED 0.15); N=20k FINAL=1385.27ms;
      N=40k FINAL=5599.31ms; doubling N -> ~4x time = quadratic. Verified candidate fix
      (single non-overlapping class `[^a-zA-Z0-9\n:]*(PASS|FAIL)(?![A-Za-z])`) keeps 31/31
      cases AND drops 40k to 0.67ms.
    is_real: true
    remediation: "Tier-3 candidate (verified): replace adjacent `[^\\w\\n:_]*[_*]*...[_*]*` value-side groups with one non-overlapping class."

