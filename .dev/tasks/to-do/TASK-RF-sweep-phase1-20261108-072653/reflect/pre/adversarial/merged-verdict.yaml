  # Source: Change 1; base R2-G7 widened with R2-G2 (calibrated, merged), V1 and V3 R2 new evidence
  - id: F-01
    severity: HIGH
    gap_class: gate-deadlock
    claim: >-
      Every owner gate tests "status is PENDING or Chosen: is empty" before any step copies the
      owner's answer into the item, so a correct run always HALTs (deadlock). Where an answer is
      present there is no check that it came from the owner in this session, no else-branch, and no
      rule for resuming after a HALT.
    affected_items: ["6.2", "shared procedure at TL:1140", "7.2", "7.4", "7.6", "7.8", "7.10", "7.12", "7.15", "7.16", "14.7", "HALT rule TL:192", "TL:978"]
    evidence: ["TL:982-992", "TL:989", "TL:1140", "TL:1151", "TL:1165", "TL:1179", "TL:1193", "TL:1207", "TL:1221", "TL:1242-1248", "TL:2481-2484", "TL:2488", "TL:192", "TL:978", "TL:184", "TL:988", "TL:1138", "TL:1298-1314"]
    recommendation: >-
      At 6.2, TL:1140, the six inline items, 7.15 and 14.7: (1) add a transcription step before the
      branch test (7.15 also copies Run id, Given by and Source); (2) Branch 1 HALTs only when Chosen
      is empty (7.15: only when Run id is empty); (3) Branch 2 sets RESOLVED only when every line is
      filled and Decision source quotes the owner's words from the current session, with the same
      quote clause in 14.7 and 7.15 and a recheck in 7.16 before any live call; (4) add a final
      else-branch that HALTs; (5) HALT if the owner's words are not in the current session; (6) add a
      resume clause to the HALT rule at TL:192 and TL:978; (7) state the line count as "the header
      plus three named lines; OQ-8 keeps its three lines". Check: grep for "PENDING or" returns 0
      lines and the else-branch sentence appears at 9 sites plus 7.15.
    provenance: {cards: [R2-G7, R2-G2, "V1 R2 New Evidence 2", "V3 R2 New Evidence 1", "V3 R2 New Evidence 3"], debate: [C-002, X-001], change: 1, invariants: [INV-001, INV-002, INV-003, INV-004, INV-005, INV-006, INV-007, INV-008]}
