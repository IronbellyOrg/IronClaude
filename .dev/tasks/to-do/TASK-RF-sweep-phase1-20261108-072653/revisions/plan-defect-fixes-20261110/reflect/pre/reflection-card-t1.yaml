findings:
  - id: L1
    severity: LOW
    category: Guard evidence can be overwritten; sentence order; no branch for changed sums
    tag: Grounded
    claim: >-
      7.30 and 7.34 record the pre-spawn sha256 sums inside fix-log-cycle1.md / fix-log-cycle2.md, which is also the output path the fix agent is told
      to write ("Write a fix log"). A fix agent that writes the log from scratch removes the baseline that the later "PASS only when all four sums
      are unchanged" depends on. The sentence also places "after the agent returns, re-run ..." before "Then spawn", so a linear reader meets the
      re-run clause before the spawn. There is no stated action when a sum differs (the Verification only says every appended re-check line is
      PASS, and the only stop rule covers an agent that fails to return). Known as N-1 / M-6; re-judged LOW: the same session holds the sums in
      context, and a changed sum still ends in a FAIL line and an unticked item.
    evidence:
      - ref: TL:1363
        quote: "after the agent returns, re-run that command first and append a PASS line only when all four sums are unchanged. Then spawn ONE `rf-qa` agent"
      - ref: TL:1363
        quote: "Write a fix log listing each finding id, the change, and the `file:line` after the change."
      - ref: TL:1363
        quote: "and the output path `.dev/tasks/to-do/TASK-RF-sweep-phase1-20261108-072653/qa/decisions/fix-log-cycle1.md`"
      - ref: TL:1365
        quote: "every appended re-check line is PASS. If the fix agent fails to return twice, log the blocker in `### Phase 7 Findings` and stop."
    recommendation: >-
      Record the sums in a separate file (for example qa/decisions/guard-sums-cycle1.md and -cycle2.md), move "Then spawn" before the "after the
      agent returns" clause, and add "on a changed sum write FAIL, log it in Phase 7 Findings and stop". Success: the baseline cannot be
      overwritten by the fix agent and a changed sum has a named result.
    self_reported_confidence: 0.8

  - id: L2
    severity: LOW
    category: Re-run list omits the F-04 check although fixers may edit the carrier file
    tag: Grounded
    claim: >-
      The 7.30 and 7.34 fixers are permitted to edit the 7.10 result file that holds the authorization section, but their re-run list repeats the
      F-08 count and the sha256 sums and omits the F-04 command that 7.20 uses (expect 1). A fixer edit that deletes or duplicates the section would
      go unnoticed until a later lens reads it. Known as N-2 / M-5(iii).
    evidence:
      - ref: TL:1363
        quote: "For the bounded exception only, also permit `src/superclaude/output-styles/pragmatic.md` and `.dev/tasks/to-do/TASK-RF-sweep-phase1-20261108-072653/phase-outputs/test-results/step-7.10-style-exception.md`"
      - ref: TL:1363
        quote: "(expect 6), and the sha256 sums recorded before the spawn (all unchanged), and append each command"
      - ref: TL:1293
        quote: "run `grep -c '^## Execution authorization (verbatim)'"
    recommendation: >-
      Add the same grep (expect 1) to the 7.30 and 7.34 re-run lists. Success: the three gates test the same carrier.
    self_reported_confidence: 0.8

  - id: L3
    severity: LOW
    category: Resume after a failed check can duplicate the authorization heading
    tag: Grounded for the text; [INFERRED] for the consequence
    claim: >-
      7.10 says "only after first writing" the authorization section and 7.20 expects exactly one such heading. If a bounded check fails, the task
      stops incomplete and 7.10 is re-run; the Action does not say "never write the section twice on resume" (the Output does say later content is
      appended and never overwrites). A literal reading of "first writing" on the second pass would add a second heading and make the 7.20 count 2.
      The Action also says "Save before/after communication excerpts ... in" the same file without the word append, and neither the 7.10
      Verification nor the Completion gate mentions the section. Known as N-4 / M-5(i)(ii).
    evidence:
      - ref: TL:1210
        quote: "and only after first writing the dated verbatim text of the owner's separate execution authorization"
      - ref: TL:1211
        quote: "with the `## Execution authorization (verbatim)` section written first (later content is appended below it, never overwriting it)"
      - ref: TL:1293
        quote: "run `grep -c '^## Execution authorization (verbatim)'"
    recommendation: >-
      In the 7.10 Action add "on a resume, if the section exists, do not write it again; append a dated re-confirmation line below it". Success:
      the 7.20 count stays 1 across a failed first pass.
    self_reported_confidence: 0.7

  - id: L4
    severity: LOW
    category: Default-run SKIP lines against a "Every check PASSes" gate
    tag: Grounded
    claim: >-
      In the default run neither OQ-17 nor OQ-18 exists, so 7.20 writes two SKIP lines. Its Verification asks for "one PASS or FAIL line per check" and
      its Completion gate says "Every check PASSes". The Action settles it by specificity ("which is not a failure"), so a careful executor proceeds,
      but a literal one can stall on the default path. Known as M-4.
    evidence:
      - ref: TL:1293
        quote: "record SKIP for a file that is absent, which is not a failure"
      - ref: TL:1295
        quote: "one PASS or FAIL line per check, each decided by the expected value written beside its command"
      - ref: TL:1296
        quote: "Every check PASSes. Once done, mark this item as complete."
    recommendation: >-
      Write an absent optional file as "PASS (absent, optional)" or add "SKIP counts as PASS" to the Verification. Success: the default path has no
      line that is neither PASS nor FAIL.
    self_reported_confidence: 0.8

  - id: L5
    severity: LOW
    category: R2 is not registered as an authority and its request file is guarded only in two gates
    tag: Grounded
    claim: >-
      The R2 request file is named only inside the 7.20, 7.30 and 7.34 Action lines; the appended end note still lists only the first revision as
      the bounded authority, and the plan has no reference entry for R2 (known as M-7). New in this run: the later fixers' sha256 guards (14.25 and
      its three siblings) hash DESIGN, SPEC, the first addendum and the first revision request but not the R2 request, so after 7.34 nothing protects
      the one file that 7.20 reads the owner's words from. The file is staged in git, so a change would show in a diff, and no gate edits it by design.
    evidence:
      - ref: TL:1293
        quote: "`## Authorization (direct, by the owner)` section of `.dev/tasks/to-do/TASK-RF-sweep-phase1-20261108-072653/revisions/plan-defect-fixes-20261110/BUILD-REQUEST.md`"
      - ref: TL:2614
        quote: "record the output of `sha256sum docs/designs/orchestrator-mode.md .dev/brainstorms/20261108-024258-orchestrator-mode-phase1/merged-requirements.md .dev/tasks/to-do/TASK-RF-sweep-phase1-20261108-072653/revisions/chat-output-exception-20261109-133150/design-addendum.md .dev/tasks/to-do/TASK-RF-sweep-phase1-20261108-072653/revisions/chat-output-exception-20261109-133150/BUILD-REQUEST.md`"
      - ref: TL:3010
        quote: "### Bounded revision metadata: chat-output-exception-20261109-133150"
    recommendation: >-
      Append the short additive note that BR2 allows, naming R2 and its request file, and add the R2 request path to the 14.25/14.29/14.38/14.42
      sum lists. Success: every sha guard in the plan covers both revision requests.
    self_reported_confidence: 0.7

  - id: L6
    severity: LOW
    category: 7.10 embeds the addendum clauses in reworded form; precedence over three style bullets is implicit
    tag: Grounded
    claim: >-
      7.10 quotes the style sentence as "Formatting never authorizes advice the sweep skill prohibits"; ADD:19 reads "advice prohibited by the sweep
      skill". Same meaning, different words inside quotation marks (known M-2). ADD:21 sentence 3 ("All other applicable style, truthfulness,
      safety, and error-reporting rules remain in force") is not embedded (grep for truthful / remain in force on TL:1210 gives 0; known M-1). STYLE
      bullets 19, 21 and 35 (lead with WHAT, end with RECOMMENDED ACTION, gloss every label) are not named as overridden, only the exception text
      says the final reply has no wrapper or gloss (known N-8, INF-A14 stays covered-in-substance). No verifier or 11.4 pin depends on these words.
    evidence:
      - ref: TL:1210
        quote: "the rule says \"Formatting never authorizes advice the sweep skill prohibits\""
      - ref: ADD:19
        quote: "Formatting never authorizes advice prohibited by the sweep skill."
      - ref: ADD:21
        quote: "All other applicable style, truthfulness, safety, and error-reporting rules remain in force."
      - ref: STYLE:21
        quote: "- End with RECOMMENDED ACTION: give one concrete next action and state why it matters."
    recommendation: >-
      Use the addendum wording (or drop the quotes) and add "all other applicable style, truthfulness, safety and error-reporting rules remain in
      force" plus "for that final reply only, this rule takes precedence over the lead-with-WHAT, end-with-RECOMMENDED-ACTION and gloss bullets".
      Success: 7.10 and ADD:17-27 name the same clauses in the same words.
    self_reported_confidence: 0.7

  - id: L7
    severity: LOW
    category: 11.4 failure branches stop short of a named next step for two causes
    tag: Grounded for the text; [INFERRED] for the consequence
    claim: >-
      The 11.4 Verification now names a route for a sweep.md or SKILL.md defect (return to 11.1 or 11.3, correct in place, re-run 11.4) and for a
      style-file defect (HALT with a named blocker). A defect in the test module itself, or a pytest or environment failure, falls to the closing
      "stop incomplete until checks pass" with no step named, although MV3's verifier asks that every 11.4 failure branch ends in a named next step.
      The test-module case is fixable in place inside 11.4's own Action, so this is a wording gap, not a dead end (known M-3(ii)).
    evidence:
      - ref: TL:1982
        quote: "log each specific blocker/fix in `### Phase 11 Findings` and stop incomplete until checks pass"
      - ref: MV3:279
        quote: "every 11.4 failure branch ends in a named next step"
    recommendation: >-
      Add "a defect in the test module is fixed in this item; an environment failure is logged and the item is re-run". Success: all four failure
      causes have a named next step.
    self_reported_confidence: 0.75

  - id: L8
    severity: LOW
    category: Authorization check is record-only and does not resolve the report paths it records
    tag: Grounded for the text; [INFERRED] for the weakness
    claim: >-
      The baseline 7.20 required that "actual (b), fresh revision checks/PRE and separate execution authorization are independently evidenced". The
      edit drops "independently" and replaces it with a count plus a read: one heading, a dated quote that matches BR2's authorization section (or a
      later dated owner message), and "the paths of the fresh structural, alignment, qualitative and PRE reports as supplied with it". No command
      checks that those paths exist, hold a PASS verdict or name the edited plan's hash; independence now rests on the 7.23 lens ("revision-check/
      execution claims to their actual evidence"). BR2 itself says its words do not by themselves start 7.10, yet the same words satisfy the 7.20
      match, and when the authorization is a later chat message there is no file to match (fails closed, V1-N3). The text is honest that a quote
      written by the executor is a record, and 7.10 Branch 1 independently refuses to start without fresh checks, so the gate is not lost, only
      thinner at 7.20. Known in part as N-5 and V1-N3; the path-resolution gap is new.
    evidence:
      - ref: TL:1293
        quote: "a quote written by the executor is a record of that authorization, not independent evidence, so a mismatch or an empty section is a FAIL"
      - ref: TL:1293
        quote: "and the paths of the fresh structural, alignment, qualitative and PRE reports as supplied with it"
      - ref: BASELINE:1293
        quote: "actual (b), fresh revision checks/PRE and separate execution authorization are independently evidenced."
      - ref: BR2:9
        quote: "It does not by itself start item 7.10: 7.10 still needs fresh checks that name the edited plan and the separate direct execution authorization the item requires"
      - ref: TL:1314
        quote: "revision-check/execution claims to their actual evidence; old PRE/waivers do not approve this delta"
    recommendation: >-
      Add to the 7.20 check: `test -s` on each recorded report path (expect exit 0) and "each report names the plan sha256 recorded in build-state.json".
      Success: the recorded paths are proven to exist before 7.20 passes.
    self_reported_confidence: 0.65

  - id: L9
    severity: LOW
    category: Two different failure routes for the same style-file hazard
    tag: Grounded
    claim: >-
      11.4 now says a style-file failure must not be sent back to ticked 7.10 because that would be a retry that can reach the design-append
      preservation stop, and HALTs instead. The first mechanical check of the style (7.20: six qualifiers, one authorization heading) is not run by
      7.10 itself, and its Verification still says to "return to the owning item and re-run this item", which for a style failure means back to
      7.10. The plan therefore holds two rules for one hazard (known N-3). The hazard in 7.10 is the original-start retry restore, not an in-place
      edit, so the 7.20 route works for a careful executor; the 11.4 text is the one that over-states it.
    evidence:
      - ref: TL:1295
        quote: "On a FAIL, return to the owning item and re-run this item; log each re-run in `### Phase 7 Findings`."
      - ref: TL:1982
        quote: "a failure caused by the style file is not sent back to ticked item 7.10 (that would be a retry that can reach the design-append preservation stop)"
      - ref: TL:1210
        quote: "Before any original-start retry restore that would erase the design append, STOP and escalate preservation"
    recommendation: >-
      In 7.20 add "a style or 7.10-result defect: correct STYLE in place under the recorded authorization, never via an original-start retry
      restore, and log it in Phase 7 Findings", or make 11.4 say the same. Success: both items describe one route.
    self_reported_confidence: 0.7

