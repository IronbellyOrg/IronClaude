# STUB — V3-Serena-medium eval scaffold. Human contract doc (grader reads evals/evals.json).
# Case: serena-verify-exitcodes — FR-RV3-MED.4.3 (C2 exit-code → deviation-class taxonomy + flaky retry).
mode: post
use_case: UC-2
verification_ran: true

# Exit-code → deviation-class mapping (only pytest exit 1 sets regression_present):
exitcode_taxonomy:
  - { tool: pytest, exit: 1, class: regression,    regression_present: true,  verification_regressions_detected: 1 }
  - { tool: pytest, exit: 2, class: grounding_gap, needs_human_decision: true }
  - { tool: pytest, exit: 5, class: drift }                       # §10.3 — claimed-added test absent
  - { tool: ruff,   exit: 1, class: s_dev_density }               # lint channel, NOT regression
  - { tool: mypy,   exit: 1, class: s_dev_density }               # type channel, NOT regression
  - { tool: pytest, exit: 124, class: grounding_gap, verify_timeout_hit: true }

# FR-4.3b flaky-retry: a failure retried once that then passes → Grounding Gap, NOT regression.
flaky_retry: { verify_flaky_suspected: true, class: grounding_gap, regression_present: false }

# Conservative default: any unmapped exit code → Grounding Gap (never silently Regression).
unmapped_exit_default: grounding_gap

# Net: exactly ONE regression (pytest exit 1); lint/type/collection/no-tests/timeout do NOT inflate it.
verification_regressions_detected: 1
regression_present: true

tier_reached: 1
escalation_reason: regression_present
