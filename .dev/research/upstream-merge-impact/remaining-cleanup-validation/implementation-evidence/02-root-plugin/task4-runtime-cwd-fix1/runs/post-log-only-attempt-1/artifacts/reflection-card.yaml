risk_register:
  - id: RR-1
    risk: "Test import `from src.greeting import greet` may not resolve under default pytest import mode."
    evidence:
      - {cite: "tests/test_greeting.py:1", quote: "from src.greeting import greet"}
      - {cite: "(Glob of audit_repo_root)", quote: "no src/__init__.py, tests/__init__.py or conftest.py was listed"}
    analysis: "[INFERRED] Under pytest's default 'prepend' import mode, with no tests/__init__.py, pytest inserts the test file's own directory (tests/) into sys.path, not the project root. `src` then resolves only if the project root is already on sys.path. That holds for `python -m pytest` run from the root (cwd is added) or if PYTHONPATH or a pythonpath ini option is set. It generally does not hold for a bare `pytest` invocation. With no src/__init__.py, `src` would be an implicit namespace package, which works once the root is on sys.path. These are pytest behaviors I did not run or verify here."
    severity: medium
    tag: "[INFERRED]"
  - id: RR-2
    risk: "`if not name` is falsy-check semantics, not 'empty'."
    evidence: {cite: "src/greeting.py:2", quote: "    if not name:"}
    analysis: "Rejects '' as claimed. It also rejects None, 0, False, [] and {} with ValueError, which is broader than the log's 'empty names'. [INFERRED] to be unintended for non-string falsy inputs."
    severity: low
    tag: "[INFERRED]"
  - id: RR-3
    risk: "Whitespace-only names are accepted."
    evidence:
      - {cite: "src/greeting.py:2", quote: "    if not name:"}
      - {cite: "src/greeting.py:4", quote: "    return f\"Hello, {name}!\""}
    analysis: "[INFERRED] '   ' is truthy, so greet('   ') returns 'Hello,    !'. Whether that violates R-002 depends on the missing spec (GG-1). No test covers it (tests/test_greeting.py:8-13 tests only '')."
    severity: low
    tag: "[INFERRED]"
  - id: RR-4
    risk: "Non-str inputs are not validated."
    evidence: {cite: "src/greeting.py:4", quote: "    return f\"Hello, {name}!\""}
    analysis: "[INFERRED] A truthy non-string, such as 42 or a list, is silently formatted via f-string instead of raising. A falsy non-string raises ValueError with the misleading message 'name required'. There is no type check and no TypeError path."
    severity: low
    tag: "[INFERRED]"
  - id: RR-5
    risk: "Test coverage is thin for the claimed behavior."
    evidence:
      - {cite: "tests/test_greeting.py:9-13", quote: "    try:\n        greet(\"\")\n    except ValueError:\n        return\n    raise AssertionError(\"empty name accepted\")"}
    analysis: "Only the '' case is covered. None, whitespace and the message text are untested. The hand-rolled try/except works but does not verify the message."
    severity: low
  - id: RR-6
    risk: "Unverified execution status."
    evidence: {cite: "execution.log:5", quote: "No test execution is claimed; inspect these files independently."}
    analysis: "All verdicts are based on static reading. No pass/fail evidence exists (verification_skip_reason: tool-unavailable)."
    severity: medium

