# Returned by Task(sc:confidence-calibrator, model=opus) — blind (card + rubric only); persisted by orchestrator.
calibrator_agent: sc:confidence-calibrator
calibrator_model_class: opus
card_model_class: sonnet
reviewer_model_classes: []        # Tier 1: no Tier-2 reviewers
calibrator_diversity: full        # opus ∉ {sonnet (card author)}
calibration: independent          # not inline-fallback
per_dimension:
  citation_grounding: 0.88
  coverage_completeness: 0.80
  deviation_classification_clarity: 0.85
  risk_surface_coverage: 0.88
  recommendation_actionability: 0.90
arithmetic: "(0.88 + 0.80 + 0.85 + 0.88 + 0.90) / 5 = 4.31 / 5 = 0.862 -> 0.86"
calibrated_confidence: 0.86
self_reported_confidence_ignored: 0.8
