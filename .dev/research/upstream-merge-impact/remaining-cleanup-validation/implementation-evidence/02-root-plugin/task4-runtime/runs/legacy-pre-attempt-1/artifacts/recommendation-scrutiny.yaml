  - {id: R-2, decision: actionable, note: "'pytest.raises(ValueError)' is an example; framework unconfirmed [UNVERIFIED]"}
  - {id: R-3, decision: needs-user-input, note: "paths depend on G-2"}
  - {id: R-4, decision: needs-user-decision}
