    owner: reviewer
    decision_needed_by_user: false
advisory_observations:
  - id: ADV-1
    hunk_ref: "src/greeting.py:2"
    observation: "[GROUNDED] The guard `if not name` rejects every falsy value, not just the empty string. [INFERRED] It would raise ValueError for None, 0 and [], and accept whitespace-only strings such as '  ' (which return 'Hello,   !'). R-002 (spec.md:9) says only 'empty name'."
    why_advisory: "Spec silent on None, non-string and whitespace inputs. No documented invariant applies."
    next_evidence_needed: "A spec criterion defining valid name input (type, whitespace handling)."
    owner: user
  - id: ADV-2
    hunk_ref: "src/greeting.py:4"
    observation: "[INFERRED] A truthy non-string, such as greet(5), returns 'Hello, 5!' without error. No type validation exists."
    why_advisory: "Spec silent on name type."
    next_evidence_needed: "A spec criterion on input type."
    owner: user
  - id: ADV-3
    hunk_ref: "tests/test_greeting.py:8-13"
    observation: "[GROUNDED] test_empty uses try/except plus `raise AssertionError` rather than pytest.raises. It asserts only the exception type, not the message. [INFERRED] This is adequate for R-003 (spec.md:12), which requires no message check."
    why_advisory: "Test style is not specified. R-001 to R-003 pin no error message."
    next_evidence_needed: "None required unless the error message becomes a contract."
    owner: user
