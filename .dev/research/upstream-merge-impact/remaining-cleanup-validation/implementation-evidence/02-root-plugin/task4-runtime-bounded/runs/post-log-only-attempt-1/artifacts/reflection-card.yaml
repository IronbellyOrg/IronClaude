    deviation_class: none
    caveat: "File exists and defines greet(name). 'Created' (vs. modified) cannot be confirmed: repo is git init only, no commits, no baseline. Match is on existence/content only."
  - task_id: T-102
    claim: "R-002: empty names raise ValueError"
    on_disk_evidence: ["src/greeting.py:2-3", "execution.log:3"]
