    why_not_classifiable: "Adherence can only be checked against the log's own three one-line claims; coverage completeness (requirements beyond R-001..R-003) and 100% adherence to an external requirement set are unassessable."
    next_evidence_needed: "--spec and/or --tasklist input; optionally --diff"
    owner: user
    decision_needed_by_user: true
  - id: GG-3
    hunk_ref: tests/test_greeting.py:1
