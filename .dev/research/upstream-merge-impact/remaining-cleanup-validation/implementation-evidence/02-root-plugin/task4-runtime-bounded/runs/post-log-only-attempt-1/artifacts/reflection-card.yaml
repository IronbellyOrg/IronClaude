    hunk_ref: src/greeting.py:2
    observation: "Guard is `if not name`; log claim is 'empty names raise ValueError'. `not name` also rejects None, 0, False, [] and other falsy non-str values; whitespace-only strings (' ') are truthy and NOT rejected; truthy non-str (e.g. 5) passes through and is formatted."
