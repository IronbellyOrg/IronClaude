    note: "[INFERRED] Behavior is a superset of 'empty string'; whether this is Drift or Authorized expansion requires a requirement definition of 'empty', which was not supplied."
  - id: DC-2
    hunk_ref: tests/test_greeting.py:1
    observation: "`from src.greeting import greet` depends on repo root being on sys.path; no __init__.py found under src (Glob); no pytest/conftest/pyproject config inspected (not in allowed inputs)."
    classification: "none_assigned (see GG-3)"
    note: "[INFERRED] Likely works as namespace package under `python -m pytest` from root; may fail with ModuleNotFoundError under bare `pytest` with default rootdir/prepend import mode. Not verified."
