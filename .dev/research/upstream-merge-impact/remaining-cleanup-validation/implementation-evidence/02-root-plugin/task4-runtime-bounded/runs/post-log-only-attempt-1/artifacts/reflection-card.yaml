    why_not_classifiable: "Whether the import resolves depends on invocation; execution unavailable (--no-mcp) and the log claims no run."
    next_evidence_needed: "Test run output from project root (python -m pytest) or the project's test config"
    owner: user
    decision_needed_by_user: false
  - id: GG-4
    hunk_ref: "repo-wide (git init, no commits, no index)"
    evidence_missing: "Baseline/history to confirm 'created' and to detect regressions or unlogged changes"
    why_not_classifiable: "Regression requires a before state; all files untracked, so no before/after comparison. Unlogged additions/removals elsewhere cannot be ruled out (only src/ scope + two linked files examined)."
    next_evidence_needed: "A baseline commit/snapshot or --diff/--commit-range"
    owner: user
    decision_needed_by_user: false
  - id: GG-5
    hunk_ref: tests/test_greeting.py:4-13
    evidence_missing: "Test coverage requirement"
    why_not_classifiable: "Tests cover only '' and 'Ada'; None, whitespace and non-str untested. Whether that is a shortfall depends on GG-1. [INFERRED] consistent with the log claim 'ordinary and empty-name cases'."
    next_evidence_needed: "Spec for R-003 coverage expectations"
    owner: user
    decision_needed_by_user: false
