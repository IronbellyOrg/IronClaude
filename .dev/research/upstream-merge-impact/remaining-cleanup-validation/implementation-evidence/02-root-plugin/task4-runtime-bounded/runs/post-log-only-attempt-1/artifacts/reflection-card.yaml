    deviation_class: none
    caveat: "Empty string '' does raise ValueError('name required') (src/greeting.py:2-3). Guard is broader than the claim (DC-1/GG-1); not classified because no spec defines the intended scope of 'empty'. Verdict is match for the literal claim; extra scope carried as a gap, not a deviation."
