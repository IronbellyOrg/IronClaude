    evidence_missing: "Driving spec / requirement text defining 'empty name' (str-only? None? whitespace?)"
    why_not_classifiable: "Without a spec, `if not name` cannot be judged Drift vs Authorized expansion vs Necessary vs Regression; inventing requirement text is prohibited."
