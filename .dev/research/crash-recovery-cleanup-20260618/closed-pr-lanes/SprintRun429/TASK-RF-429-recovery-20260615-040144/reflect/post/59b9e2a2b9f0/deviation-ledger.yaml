  - id: R1-F3
    deviation_class: drift
    severity: LOW
    title: "Per-attempt turns_consumed/output_bytes not accumulated across re-route spawns"
    file: "src/superclaude/cli/sprint/executor.py:1031-1040,1067-1081,1125-1144"
    requirement: "Spec is silent on turn-accounting across re-route attempts (not a stated requirement)."
    actual: "On RETRY the loop `continue`s; the next spawn overwrites turns_consumed/output_bytes, so ledger reconciliation + persisted TaskResult reflect only the LAST spawn. Real but low-impact: single-account 429s typically fail fast with ~0 output tokens (cf. `_is_transient_failure` is_error+0-tokens). Unspecified silent choice, no inline rationale → Drift, but functionally negligible."
    evidence: "executor.py:1031-1040 (per-spawn assign), :1067-1081 (continue, no accumulate), :1125-1144 (reconcile uses last). Reviewer 1 (sonnet)."

  - id: R2-H6
    deviation_class: drift
    severity: LOW
    title: "Single-session resume_command may drop --model when halt_task_id is empty"
    file: "src/superclaude/cli/sprint/models.py:866-901"
    requirement: "UX contract #6: resume names the exhausted model + suggests a distinct model."
    actual: "resume_command() gates `if suggested and halt_task_id:`. On the SINGLE-SESSION path halt_task_id falls back to last_task_id (typically '') so a valid suggestion is dropped, emitting the --start/--end resume without --model. The PER-TASK path (the common recovery case) carries a real task id and works. Mitigation: the full halt block account_exhaustion_output() (wired into write_summary, logging_.py:343) STILL surfaces the exhausted model + suggestion, so the operator is not deprived of the suggestion overall. LOW drift; the inline comment documents only the no-alternate fallback, not the empty-id case."
    evidence: "models.py:889 truthiness guard; :866-873 halt_task_id fallback to last_task_id. Reviewer 2 (haiku); orchestrator re-read."

  - id: R1-F1
    deviation_class: drift
    severity: LOW
    title: "Doc-vs-code: cap labeled 'per task' but implemented as a shared per-phase budget"
    file: "src/superclaude/cli/sprint/recovery_policy.py:41 ; docs/guides/sprint-cli-tools-release-guide.md:73"
    requirement: "Spec Q4: reset budget is 'per-run / in-memory'; Q5: cap is a sprint-wide backstop against a dead pool."
    actual: "SessionResetPolicy is constructed once per phase (executor.py:1355) and shared across sequential tasks, so _exhaustion_attempts accumulates phase-wide. The IMPLEMENTATION matches spec Q4/Q5 (per-run shared budget; the docstring lines 33/35-36 say so explicitly). BUT the field comment recovery_policy.py:41 ('per-task re-spawn cap') and the release guide line 73 ('per task') contradict the shared semantics. Behavior is spec-consistent; only the documentation is inconsistent. NOT a regression."
    evidence: "recovery_policy.py:33,35-36 (shared/per-run) vs :41 (per-task) — internal contradiction; executor.py:1355 per-phase construction; spec §8 Q4/Q5. Reviewer 1 (sonnet); orchestrator re-read recovery_policy.py."

  - id: R1-F2
    deviation_class: drift
    severity: LOW
    title: "Parallel latch overshoot may emit duplicate account_exhaustion_halt events"
    file: "src/superclaude/cli/sprint/executor.py:1066-1100"
    requirement: "Spec §5 edge #3: spawn is UNLOCKED; total spawns ≤ cap+(K-1), strictly < K×cap (explicitly NOT ≤ cap)."
    actual: "Up to K-1 in-flight workers may already be mid-spawn when the latch trips; each can increment _exhaustion_attempts past cap and emit its own write_account_exhaustion_halt. This is WITHIN the spec's acknowledged ≤cap+(K-1) overshoot envelope — the storm bound holds. Residual concern is telemetry duplication (session_resets/halt events can exceed cap), not a control-flow defect. Spec-consistent behavior; LOW drift on observability only."
    evidence: "executor.py:1067 (increment under guard), :1085 (latch trip), :1090-1100 (halt event); spec §5 edge #3 lines 294-298. Reviewer 1 (sonnet)."

  - id: R3-003
    deviation_class: necessary
    severity: LOW
    title: "Resume-safety test asserts inclusion of exhausted task, not exclusion of prior successful task"
    file: "tests/sprint/test_resume.py:175-193"
    requirement: "UX contract #5/#7: never re-run validated-successful tasks; re-attempt only the exhausted task + everything after."
