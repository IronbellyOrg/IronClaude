recommended_test_fixes:
  - test_id: E4
    probe_id: I4a (AC4.4)
    fix: >-
      Replace the literal separator in the incident-rebind regex
      "Diagnostic artifacts.*report_path .REPORT\\.md.*audit_log_path" with a tolerant
      ".*" between report_path and REPORT.md:
      "Diagnostic artifacts.*report_path.*REPORT\\.md.*audit_log_path"
      so it matches the backtick+space+paren rendering at T1:260.
  - test_id: E4
    probe_id: I1b / C2 (AC4.7)
    fix: >-
      Fix the baseline cross-check regex to match BASE markdown bold + em-dash punctuation:
      use "STOP.* testing immediately" (tolerate the "**" around STOP) and replace the
      " .. " em-dash span with ".*" — e.g.
      "STOP.* testing immediately|FREEZE.*implementation.*no further code changes permitted".
      (Note the freeze block itself is byte-identical via AC4.1/DIFF_EXIT=0; only the
      self-consistency cross-check regex is over-strict.)
  - test_id: E3
    probe_id: H6 (AC3.4) — branch_keys_found_count
    fix: >-
      Make the digest deterministic by defining branch_keys_found_count from the fixed set of
      6 semantic branch keys (test_is_wrong, remediation_target==docs, status==success,
      recommended_escalation in {none,retry,escalate_depth,halt}) rather than the raw rg match-line
      count, OR exclude branch_keys_found_count from normalized_observations (it is not an AC
      input — AC3.4 only requires presence of all six keys + the precedence note, which all 3 runs
      confirmed). Either change makes E3's 3 digests byte-identical.
