      run-2 PASS, run-1 & run-3 FAIL. The load-bearing safety gate AC4.1 (freeze block
      byte-identity, DIFF_EXIT=0) PASSES in ALL THREE runs, and AC4.2/AC4.3/AC4.5/AC4.6
      PASS in all three. The split is confined to two literal probe-regex commands that
      under-match real file punctuation: (a) AC4.4 / probe I4a (incident-rebind)
      "Diagnostic artifacts.*report_path .REPORT\\.md.*audit_log_path" returns 0 hits
      because T1:260 is "report_path` (REPORT.md)" — backtick+space+paren (3 chars) where
      the probe's " ." matches only space+one char; a loosened ".*"-separator probe matches
      L260, and the clause-2 falsification (zero rca-verdict/solution-verdict) PASSES in all
      runs. (b) AC4.7 / probe I1b (baseline cross-check) "STOP. testing" expects 1 char where
      BASE has "**STOP** testing" (3 chars), and " .. " (2 dots) cannot span the single-codepoint
      em-dash "—". run-2 graded these two AC on substantive content (PASS); run-1/run-3 bound
      the verdict to the literal exit codes (FAIL). No run found a content/invariant regression;
      incident_rebind normalized true(run-2)/false(run-1,3) and baseline_hits 2(run-2)/0(run-1,3)
      are the only differing normalized keys, both probe-instrument artifacts.
    probe_id: "E4 I4a (AC4.4 incident-rebind) and E4 I1b/C2 (AC4.7 baseline cross-check)"
    cause_class: test_probe_artifact

