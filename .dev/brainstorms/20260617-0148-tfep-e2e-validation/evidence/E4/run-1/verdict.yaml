verdict_reason: >-
  AC4.1/AC4.2/AC4.3/AC4.5/AC4.6 PASS: the live Step-1 freeze block is byte-identical to the
  recorded baseline (DIFF_EXIT=0), both asymmetric remediation gates (test_is_wrong, docs)
  are present, exactly one **Diagnostic backend:** declaration plus the backend-neutral clause
  exist, the report-template asymmetric rules are present, and the freeze block contains zero
  forensic/troubleshoot backend tokens. However AC4.4 and AC4.7 FAIL *as the literal probe
  commands are specified*. AC4.4 clause-1 (incident-rebind) regex
  "Diagnostic artifacts.*report_path .REPORT\.md.*audit_log_path" returns 0 hits because the
  actual line-260 text is "`report_path` (REPORT.md)" — the ` .` in the probe matches only
  one char between report_path and REPORT, but the file has backtick+space+open-paren (3 chars);
  a loosened "report_path.*REPORT\.md.*audit_log_path" matches line 260, confirming the CONTENT
  is present and correct. AC4.7 baseline cross-check
  "STOP. testing immediately|FREEZE.*implementation .. no further code changes permitted" returns
  0 hits on BASE because BASE text is "**STOP** testing immediately." (probe `STOP. testing`
  expects 1 char between STOP and " testing" but file has `** ` = 3 chars) and the em-dash `—`
  is one UTF-8 codepoint that ` .. ` (2 dots) cannot span. Both failures are probe-regex /
  content-punctuation-spacing mismatches, NOT safety-invariant regressions — the underlying
  invariants are intact. Verdict is FAIL strictly because the deterministic AC are bound to the
  literal commands and 2 of 7 do not produce their EXPECT result.
