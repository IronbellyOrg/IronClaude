  remediation_target enum (test/code/docs/none) present in BOTH P1 and R1.
  AC2.6: exactly one Diagnostic-backend declaration in T1. AC2.7
  (falsification): zero producer-internal field leak (tier_reached/confidence:/
  escalation_reason) in the R1 "## TFEP Consumer" block (grep exit 1).
  NOTE on probe-pattern artifact: the verbatim Probe 4/5 commands use an
  ESCAPED pipe ("none\\|retry...") which rg treats as a LITERAL "|" character.
  R1 renders the enum with plain pipes (<none|retry|...>) so it matches; P1
  renders the same enum inside a markdown table with table-escaped pipes
  ("none\\|retry\\|...") so the literal-"|" pattern does NOT match P1. This is
  a rendering/escaping artifact of the probe pattern, NOT a real absence: the
  enum tokens are semantically present in P1 (SKILL.md lines 73 and 75) and in
  R1 (report-template.md lines 163 and 165). The normalized observations record
  the semantic truth (rec_esc_enum_P1/R1 and rem_tgt_enum_P1/R1 all true),
  which is what AC2.4/AC2.5 grade.
