test_name: "Adapter Contract Round-Trip"
run_index: 2
verdict: PASS
verdict_reason: >-
  All 7 acceptance criteria satisfied on content. AC2.1: every cell of the 7-field x 3-file
  presence matrix is >=1 (min cell = 1). AC2.2: exactly 5 "TFEP adapter field (contract v1.1.0"
  rows in P1. AC2.3: contract_version default `1.1.0` present in P1 (line 62). AC2.4: the
  recommended_escalation enum `none|retry|escalate_depth|halt` is present in BOTH P1 (line 73)
  and R1 (line 163). AC2.5: the remediation_target enum `test|code|docs|none` is present in BOTH
  P1 (line 75) and R1 (line 165). AC2.6: exactly one "Diagnostic backend ... troubleshoot"
  declaration in T1. AC2.7 (falsification): zero producer-internal field leak (tier_reached /
  confidence: / escalation_reason) inside the `## TFEP Consumer` block of R1 (exit 1, as required).
  PROBE-INSTRUMENT NOTE: The spec's literal probe-4/probe-5 commands
  (`rg -n "none\|retry\|escalate_depth\|halt"` and `rg -n "test\|code\|docs\|none"`) return EXIT=1
  with no output on P1. This is a ripgrep-regex artifact, NOT a content failure: in the default
  Rust regex engine `\|` is a LITERAL pipe, so the pattern searches for plain `none|retry|...`,
  while P1's table cells markdown-escape the pipes as `none\|retry\|...` (backslash present),
  causing a non-match. R1 uses unescaped literal pipes so the same pattern matches there. A
  backslash-tolerant re-probe (recommended_escalation.*none.*retry.*escalate_depth.*halt and
  remediation_target.*test.*code.*docs.*none) confirms both enums ARE genuinely present in BOTH
  files. AC2.4/AC2.5 are content criteria ("enum in BOTH P1+R1") and are met. Normalized
  rec_esc_enum_P1 / rem_tgt_enum_P1 record actual content presence (true).
worktree: /config/workspace/IronClaude/.dev/worktrees/tfep-troubleshoot-backend
