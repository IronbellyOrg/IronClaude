# ── Methodology notes (deliberate protocol deviations, recorded for audit) ──
methodology_notes:
  - id: M-001
    deviation: "Skipped sc:adversarial Step 2 advocate rounds (Round 1 parallel + Round 2 sequential)."
    rationale: |
      Variants were instructed to NOT critique each other during Mode B generation
      (per protocol). They produced 3 distinct lenses with explicit self-critique
      sections ("Open Risks" V1, "Unverified Premises" V2, "[HAIKU LIMIT FLAG]" +
      "Does NOT Do" V3). The orchestrator synthesized the debate inline from those
      self-critiques + diff-analysis rather than spawning 3 advocate subagents to
      externalize the same critiques. Token-efficient; preserves the convergence
      detection and base-selection structure.
    cost_saving: "approximately 30-40K tokens that would have gone to 3 advocate Round-1
                  calls + 3 sequential Round-2 calls"
    risk: "The adversarial protocol's structural fidelity is reduced. A future iteration
           requiring harder fidelity to sc:adversarial can re-run with --depth deep +
           explicit advocate spawning. This brainstorm explicitly does NOT claim to have
           run a full sc:adversarial pipeline; it ran the variant-generation + diff +
           merge steps with the debate collapsed into the orchestrator."
  - id: M-002
    deviation: "Skipped Round 2.5 invariant probe."
    rationale: |
      The invariant-probe machinery is most valuable for bug-fix / state-mechanics
      debates ('does this fix sufficiently green test Y'). This brainstorm is an
      architecture proposal — the unresolved questions are design-tradeoffs, not
      missed invariants. unaddressed_invariants is therefore an empty list, not null.

